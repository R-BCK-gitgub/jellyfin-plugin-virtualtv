changelog: >
  Revises 1.10.7 without changing the version number. The neutral Live TV loading source remains universal for every channel, but PlaybackStart no longer starts the handoff timer. Virtual TV now waits for the first real PlaybackProgress report from the loading channel, immediately returns from Jellyfin's event pipeline, then runs a detached five-second cancellable buffer. Only after those confirmed five seconds does it resolve the current schedule/rules and send one PlayNow for one VOD item. EOF follows the same Loading -> confirmed progress -> 5 seconds -> VOD cycle. The embedded H.264/AAC loading MP4 now exposes explicit video/audio stream metadata and disables probing to reduce player inference work, especially on webOS. Guide alignment and Content Coverage dark-mode/spacing fixes from 1.10.7 are unchanged.
