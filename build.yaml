overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Adds a Standard TV Play-from-Beginning shortcut without changing the player UI: the native Jellyfin Record action now opens the currently airing movie or episode from 00:00 in Jellyfin's normal library player and replaces the Live TV session. On Android TV, both 'Record series' and 'Just this once' launch the current episode/movie from the beginning; no DVR timer is created. The action is restricted to Virtual TV Standard TV channels and targets the exact Jellyfin device/session that issued the Record request. Personalized TV, scheduling, True Random weights, Guide geometry/text styling and all other playback behavior are unchanged. Version 1.10.18 remains the last stable baseline.
