overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Removes the Personalized TV metadata-protection layer entirely. Sequential, Random and other non-watched-dependent Personalized modes now resolve the current Guide item, send one isolated one-item PlayNow without StartPositionTicks, and then leave Jellyfin's normal VOD playback and user-state handling alone until stop or EOF. They no longer snapshot, restore, suppress or rewrite Watched, Resume, PlayCount, stream selections or Continue Watching. Next Unwatched and Random Unwatched are intentionally unchanged and retain their existing zero-start plus guarded Resume-first behavior. Standard TV is intentionally unchanged. The 2-second Loading handoff, one-item queue and EOF-to-Loading re-resolution remain intact. Obsolete state-protection code, DI wiring and event logic are removed.
