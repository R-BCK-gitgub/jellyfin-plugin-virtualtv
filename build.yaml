overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Adds True Random scheduling for Series channels with per-series relative weights. Weight appears only when True Random is selected. Every selected series defaults to Weight 1; Weight 2 is twice as likely as Weight 1, Weight 3 is three times as likely, and so on. Each series turn is an independent weighted draw and consecutive repeats are allowed. Episodes per Turn still controls how many consecutive episodes or blocks the selected series receives. Existing channels remain backward compatible at Weight 1. Randomized Rotation, Repeating Order, Manual Order, Smart Schedule, playback behavior, the 2-second Personalized Loading buffer and the stock Jellyfin Guide are unchanged.
