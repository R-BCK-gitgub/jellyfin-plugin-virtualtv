changelog: >
  Virtual TV 2.0.1.2 test build fixes Standard TV Record-to-Play-from-Beginning on Jellyfin Android phone/tablet and Android TV. Android Record requests return before player handoff, then a hosted dispatcher targets only the active media-control controller to avoid Web Player spinner stalls and Android session/controller misrouting. Standard TV HLS compatibility, scheduling and Personalized TV behavior remain unchanged.
