overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  LG webOS compatibility release. Traditional channels on LG remain in the native
  Virtual TV Live TV transport and use a rebased source timeline so the current
  wall-clock point is exposed to the player as 00:00 instead of a mid-file VOD
  start. Natural programme completion retunes the same channel onto a fresh
  rebased timeline. Channel descriptions remain stored in plugin settings but are
  no longer published as Jellyfin channel Overview because stock clients place
  that text below the full Guide instead of beneath the title.
