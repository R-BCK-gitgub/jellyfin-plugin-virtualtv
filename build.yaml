overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Keeps the simplified deterministic 1.10.4 playback architecture and the enlarged/aligned 1.10.5 Guide UI. Adds two 10-second H.264/AAC bootstrap clips (black and 'Loading Virtual TV...') generated at build time and embedded inside the plugin DLL. The Live TV bootstrap now always plays the neutral 'Loading Virtual TV...' clip instead of scheduled library media; after the client opens it, Virtual TV resolves the schedule-authoritative item and performs the existing single VOD PlayNow handoff. Both clips are extracted automatically to Jellyfin's cache on first use, so no manual Docker file placement is required. Smart coverage, full channel editing, Content Coverage reporting and watched-state behavior are unchanged.
