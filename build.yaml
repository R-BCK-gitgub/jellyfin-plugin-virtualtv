  Pre-release feature-complete milestone built on the stable 1.9.1 playback baseline. Adds season/Specials eligibility, per-user traditional channel visibility, personal watched-dependent ownership, Movie Random Unwatched, persistent shuffle-cycle scheduling, Manual Order, expanded Smart Schedule lifecycle, Generate New Schedule preservation rules, weekly Extend, daily Reconcile, startup recovery, seven-day history, explicit Off Air/content/schedule states, and supporting quality gates.
