overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Simplifies playback to one generation-safe PlayNow request for exactly one resolved item per tune, with a cancellable 500 ms initial handoff delay, no Current+Next queue, no delayed LG seek, no continuation watchdog and schedule-authoritative re-resolution at every physical EOF. Stale events from a previous channel can no longer close or overwrite the current tune. Smart Schedule now uses a stable weekly coverage-first series cycle so every eligible series appears before any repeats when the week has enough turns. Existing channels are fully editable and structural changes mark the schedule for regeneration. Adds Content Coverage with clickable Unassigned/Assigned/Multiple filters and CSV export. Installs a delimited Jellyfin Custom CSS block that enlarges Live TV Guide rows and the channel column while preserving existing custom CSS. Channel descriptions remain hidden from Jellyfin Overview.
