overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Watched-dependent playback correction: Next Unwatched now selects the earliest chronologically unwatched episode for the active Jellyfin user; Random Unwatched selects only from that user's unwatched pool. Both modes hand off exactly one resolved Episode to normal Jellyfin VOD playback at 00:00, so episode title, elapsed/remaining duration, seek and subtitle behavior match the proven Sequential player. Episode completion always re-queries the active schedule block before resolving the next episode. Sequential playback is unchanged.
