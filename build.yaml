changelog: >
  Final revision of 1.10.7 keeps the universal Loading Virtual TV bootstrap and progress-confirmed five-second buffer, and makes each resolved episode/movie a truly isolated one-item VOD session. Virtual TV now bypasses Jellyfin's SendPlayCommand only for concrete VOD items because Jellyfin 12.1 automatically expands a single Episode PlayNow into the remainder of the series when the user's next-episode autoplay preference is enabled. The plugin sends the already-resolved VOD item directly to the exact session controller as one raw Play message, so there is no native Next Up queue and no sequential SxxExx autoplay. At physical EOF, including near-end seek completion, the VOD player is allowed to close, Virtual TV waits a one-second teardown buffer, reopens the neutral Live TV loading channel through Jellyfin's standard channel path, waits for real loading playback progress plus five seconds, then resolves the wall clock/rules again and opens one new isolated VOD item. Existing Guide alignment and Content Coverage UI fixes remain unchanged.
