overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Replaces the failing finite-MP4 Live TV bootstrap with a stream-oriented 60-second MPEG-TS loading runway while keeping the same universal Loading Virtual TV experience. The source is read at native frame rate, DirectPlay is disabled, DirectStream/remux and compatible transcoding remain available, and the plugin still waits for real PlaybackProgress plus five seconds before opening exactly one isolated VOD item. This avoids presenting a 10-second MP4 DirectPlay source as Jellyfin's infinite Live TV stream and gives browser/webOS clients a conventional Live TV delivery path. The Guide keeps its corrected row alignment and now adds a synchronized 0.45rem vertical gutter between every channel row and the matching programme row. All scheduling, watched-state, Content Coverage and single-item VOD/No-Next-Up behavior are otherwise unchanged.
