description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Restores the proven 1.10.1 episode/VOD player architecture on every client, including LG webOS. Traditional channels again hand off to the real Jellyfin episode with the full episode timeline, normal rewind/fast-forward and normal subtitle switching. LG webOS keeps that same VOD handoff but avoids the decoder failure caused by a remote mid-file PlayNow: the item opens at 00:00 and receives one 500 ms deferred seek to the schedule-authoritative live offset. Existing watched/resume protection, current-plus-next queue continuity and end-of-episode live resynchronisation remain intact. Channel descriptions continue to stay out of Jellyfin Overview because stock clients place Overview below the Guide.
