overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Keeps the simplified 1.10.4 playback architecture unchanged. Refines the Jellyfin Live TV Guide presentation by enforcing one identical 7.8em row height/flex-basis for both channel cards and programme rows, preventing cumulative vertical drift. Programme-cell content is vertically centred. The channel column is widened by 50% from 18vw to 27vw, channel-number text is larger and bolder, and channel logos are slightly enlarged. All 1.10.4 scheduling, Smart coverage, full channel editing, Content Coverage reporting and playback behavior are preserved.
