changelog: >
  Virtual TV 1.0.0 is the first official public full release for Jellyfin 12.1. It promotes the validated 2.0.1.4 test build without changing playback or scheduling behavior, and includes Standard TV and Personalized TV, weighted True Random, watched-aware modes, Content Coverage, compact channel actions, and per-channel configuration import/export. Standard TV streaming, Personalized TV, scheduling and Guide geometry are otherwise unchanged from the validated test build.
