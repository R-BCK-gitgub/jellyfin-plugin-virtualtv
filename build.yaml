overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Virtual TV 2.0.1.0 adds per-channel Standard TV quality (480p, 720p or 1080p), Clone Channel, Android TV Record-to-Play-from-Beginning compatibility, an optional Hide from Android TV setting for Personalized channels, and a dedicated Personalized TV handoff for Jellyfin for Android phones/tablets. Web and webOS behavior remains unchanged. Existing Standard TV channels keep the historical 720p setting until edited; new Standard TV channels default to 1080p.
