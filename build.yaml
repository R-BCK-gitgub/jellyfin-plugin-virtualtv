overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Simplifies Personalized TV playback. Next Unwatched and Random Unwatched retain their existing Resume-first rules. Every other Personalized TV mode now uses the Guide only to select the concrete episode or movie and always opens that item at 00:00; all wall-clock/grid offset calculations, delayed grid seeks and seek-confirmation state have been removed. The one-item isolated VOD queue remains, so Jellyfin Next Up cannot auto-expand the series. At physical EOF Virtual TV returns to Loading, resolves the current Guide again and opens the resulting item from 00:00, including the same item again when the user fast-forwards to EOF before the Guide slot changes. Watched/Resume protection for non-watched-dependent Personalized modes is retained. Standard TV now keeps one continuous broadcast producer per tune-in across Jellyfin probe/player reads to prevent the initial 1-2 second replay.
