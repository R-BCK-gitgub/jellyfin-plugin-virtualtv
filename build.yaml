overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Reworks playback into an explicit, serialized Bootstrap -> VOD -> Bootstrap loop. Every Virtual TV channel immediately opens the embedded 10-second 'Loading Virtual TV...' Live TV source, waits a 2-second client buffer, then resolves the current schedule/rules and sends one PlayNow for exactly one VOD item. At physical EOF the plugin never opens another episode directly: it first returns to the Live TV loading source, waits for that bootstrap to start and settle, then resolves the wall clock again and opens the correct next/current item. This removes direct VOD-to-VOD transition races and gives webOS/Android TV a clean player teardown boundary. Guide alignment is also corrected by replacing em-based row heights with one fixed 8.25rem shared metric for channel cards and programme rows; programme text remains vertically centred and the 27vw channel column is preserved.
