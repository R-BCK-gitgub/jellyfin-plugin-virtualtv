overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Stabilizes Personalized TV playback on webOS by removing all plugin user-data writes while a VOD is actively running. Traditional Personalized TV now snapshots the item's original Jellyfin state once before PlayNow, leaves PlaybackStart and PlaybackProgress untouched, and restores the stopped item only after Jellyfin has processed PlaybackStop; session close retains a short final restore grace for late Jellyfin events. Next Unwatched and Random Unwatched remain unprotected and keep normal Resume/Watched behavior. Personalized Loading is increased from 1.5 to 2 seconds. Standard TV now reuses an already-open direct live stream for the same streamId and enables stream sharing to avoid probe/player duplicate producers. Scheduling, one-item VOD playback, zero-start traditional Personalized behavior, EOF-to-Loading continuity and UI are unchanged.
