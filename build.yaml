overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Virtual TV 2.0.1 adds per-channel Standard TV broadcast quality (480p, 720p or 1080p), a Clone Channel action that opens a new pre-filled channel without copying its schedule, and Android TV compatibility handling for Standard TV Record-to-Play-from-Beginning. Existing Standard TV channels retain the historical 720p setting until edited; new channels default to 1080p in the editor. Personalized TV scheduling and playback rules are unchanged.
