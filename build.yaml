overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Unifies Personalized TV VOD startup on the exact playback path already proven stable by Next Unwatched and Random Unwatched. Sequential, Random and other traditional Personalized modes now send the same isolated one-item PlayNow with StartPositionTicks=1 and no special null/start-position branch. Their pending Resume is always zero, so no follow-up seek or playback command occurs after PlayNow. Next Unwatched and Random Unwatched keep their existing selection and Resume-first behavior unchanged. Standard TV is unchanged. Obsolete omitStartPosition/start-mode branching and related temporary variables have been removed. The 2-second Loading handoff, one-item queue, no-Next-Up behavior, normal Jellyfin metadata handling and EOF-to-Loading Guide re-resolution remain intact.
