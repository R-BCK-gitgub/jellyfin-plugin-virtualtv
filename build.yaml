description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Dynamic series playback milestone: adds Sequential, Next Unwatched, Random Unwatched and Random modes; fixed 20/30/40/45/60/75/90/120-minute unwatched blocks; Repeating Order, Randomized Rotation, Manual Order and Smart Schedule strategies; one/two consecutive turns; automatic Smart Schedule rotation refresh; and strict Jellyfin state policy so only the two Unwatched modes write watched/resume progress.
