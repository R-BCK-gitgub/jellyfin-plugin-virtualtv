overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Restores canonical Jellyfin Live TV channel labels so the Guide receives the real channel number and name (for example, 1 and Disney Shorts instead of Channel 1 and - Disney Shorts). Adds text-only Guide readability polish: programme titles use 0.82em text with normal word wrapping and a two-line maximum, while channel number/name text uses 0.80em. The stock Jellyfin Guide geometry is intentionally unchanged: no row height, cell size, channel column width, spacing, logo size or positioning is modified. Scheduling, True Random weights, Standard TV, Personalized TV and playback behavior are unchanged.
