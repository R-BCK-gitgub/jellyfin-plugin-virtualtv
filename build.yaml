  Quality and stability release for the 1.10 feature set. Hardens traditional watched/resume isolation, suppresses duplicate channel-start handoffs, simplifies concrete playback to a current-plus-next queue with safer transition timing, adds editable channel descriptions and channel-detail presentation formatting, fixes Settings editor Back/Cancel navigation, and simplifies EPG episode labels to series plus episode title.
