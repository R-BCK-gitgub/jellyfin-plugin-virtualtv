changelog: >
  Restores the Jellyfin Live TV Guide to the stock/default Jellyfin presentation. All Virtual TV Guide sizing, row-height, spacing, channel-width, logo-size and programme-cell CSS overrides have been removed. On upgrade, Virtual TV removes the legacy CSS block it previously stored in Jellyfin Branding Custom CSS, while preserving any unrelated custom CSS. No playback, scheduling, channel, Standard TV, Personalized TV, Content Coverage or plugin configuration UI behavior is changed.
