overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Adds two explicit channel experiences while preserving the established UI and scheduling model. Personalized TV now waits 1.5 seconds after confirmed Loading playback, resolves Resume before never-started content for Next Unwatched and Random Unwatched, and opens VOD at 00:00 before issuing one guarded post-progress seek for Resume or wall-clock offsets to avoid webOS non-zero-start freezes. Standard TV is a separate true linear Live TV pipeline with only concrete schedules, no Loading/VOD handoff, no seek/restart/resume/Next Up, no Jellyfin watched-state impact, wall-clock-aligned programme entry, continuous H.264/AAC MPEG-TS output, and automatic English subtitle burn-in when a supported English track is available. Existing channels remain Personalized TV by default. Guide spacing, Content Coverage, Smart Schedule, visibility and single-item VOD queue protection are retained.
