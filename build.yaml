changelog: >
  Virtual TV 2.0.1.3 test build hardens Standard TV Play from Beginning on Jellyfin Android phone/tablet and Android TV. It captures the request-time session/device, lets the Record response and client refresh complete, confirms the real library item starts, and re-resolves/retries the active media-control controller when required. Standard TV streaming, scheduling, Personalized TV and Guide geometry are unchanged.
