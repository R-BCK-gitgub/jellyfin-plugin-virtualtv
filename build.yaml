overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Fixes Personalized TV wall-clock/grid offsets on webOS without changing the already-working Next Unwatched, Random Unwatched or Resume selection logic. Concrete scheduled episodes still open as one isolated VOD item at 00:00, but the plugin now ignores Jellyfin server-generated automated progress for grid seeks and waits until the exact client PlaySessionId has reported at least two seconds of genuinely increasing playback. Only then is one wall-clock seek sent, with the target recalculated at that moment so the channel remains aligned to the Guide. The seek is never retried automatically; subsequent real client progress is used only to confirm that the target was reached. Loading remains 1.5 seconds, Standard TV and the existing UI are unchanged.
