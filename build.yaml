overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Simplifies Live TV bootstrap startup and finalizes the requested five-second handoff buffer. Every Virtual TV channel now exposes the same already-materialized embedded 'Loading Virtual TV...' MP4 as a ready media source with RequiresOpening=false, removing the extra Jellyfin live-stream open handshake and all schedule/content lookups from the channel stream-open path. The five-second timer starts only after Jellyfin reports the loading channel as actually playing; then Virtual TV resolves the current schedule/rules and sends one PlayNow for one VOD item. Physical EOF still returns to the loading channel first and repeats the same five-second cycle. Guide alignment now explicitly removes client/theme-added vertical margins from both channel and programme row stacks to prevent cumulative drift. Content Coverage gains visual separation from the channel table and white summary-card text for Jellyfin dark mode.
