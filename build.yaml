overview: "Virtual linear TV channels inside Jellyfin"
description: >
  Creates and manages virtual linear TV channels using media already available
  in Jellyfin, with scheduling, Guide/EPG and playback behavior defined by the
  Virtual TV functional specification.
category: "General"
artifacts:
  - "Jellyfin.Plugin.VirtualTV.dll"
changelog: >
  Reduces Personalized TV wall-clock/grid handoff latency from Jellyfin Web's 10-second periodic progress cadence to a 1.5-second post-PlaybackStart readiness buffer. Concrete scheduled VOD still opens at 00:00 first; once the exact client VOD PlaybackStart is accepted, Virtual TV waits 1.5 seconds, recalculates the current Guide offset, and sends one seek. If the client rebuilds/restarts the VOD before that command, the 1.5-second window restarts from the newest PlaybackStart so a stale timer cannot seek too early. Next Unwatched, Random Unwatched and the already-working Resume path are unchanged. Loading remains 1.5 seconds, Standard TV and the UI remain unchanged.
