name: Build Virtual TV Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: virtualtv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Version not found in csproj")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Validate package metadata versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = (root.findtext(".//Version") or "").strip()

          meta = json.loads(Path("meta.json").read_text(encoding="utf-8"))
          meta_version = str(meta.get("version", "")).strip()

          build_text = Path("build.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*["\']?([^"\'\s]+)["\']?\s*$', build_text, re.MULTILINE)
          build_version = match.group(1) if match else ""

          values = {
              "csproj": version,
              "meta.json": meta_version,
              "build.yaml": build_version,
          }

          print("Version check:", values)
          if not version or len(set(values.values())) != 1:
              raise SystemExit(f"Version mismatch: {values}")
          PY

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj --configuration Release --no-restore

      - name: Validate Virtual TV page structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")

          page_start = page.index('<div id="VirtualTVConfigPage"')
          content_start = page.index('<div data-role="content">', page_start)
          style_start = page.index('<style>', page_start)
          style_end = page.index('</style>', style_start)

          if not (page_start < style_start < style_end < content_start):
              raise SystemExit("Virtual TV CSS must live inside the plugin page div before page content.")

          head_end = page.index('</head>')
          if '<style>' in page[:head_end]:
              raise SystemExit("Head-level CSS detected. Jellyfin plugin pages do not reliably retain head styles.")

          required = [
              'data-ui-version="1.8.2.0"',
              'class="vtv-channel-table"',
              'class="vtv-content-grid"',
              'class="vtv-content-card',
              'vtv-content-year',
              'vtv-content-library',
              'background:#15566c',
          ]
          missing = [token for token in required if token not in page]
          if missing:
              raise SystemExit(f"Missing expected UI tokens: {missing}")

          forbidden = [
              'vtv-channel-card',
              'vtv-content-detail-label">Year',
              'vtv-content-detail-label">Library',
          ]
          present = [token for token in forbidden if token in page]
          if present:
              raise SystemExit(f"Obsolete UI tokens still present: {present}")

          print("Virtual TV page structure validation passed.")
          PY

      - name: Validate Live playback invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path("Jellyfin.Plugin.VirtualTV/Services/LiveTvPlaybackCoordinator.cs").read_text(encoding="utf-8")
          protection = Path("Jellyfin.Plugin.VirtualTV/Services/PlaybackStateProtectionManager.cs").read_text(encoding="utf-8")
          start_consumer = Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStartConsumer.cs").read_text(encoding="utf-8")
          progress_consumer = Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackProgressConsumer.cs").read_text(encoding="utf-8")
          stop_consumer = Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStopConsumer.cs").read_text(encoding="utf-8")
          registrator = Path("Jellyfin.Plugin.VirtualTV/PluginServiceRegistrator.cs").read_text(encoding="utf-8")
          service = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")

          # Keep the proven 1.8.1 wall-clock handoff.
          required_handoff = [
              'StartPositionTicks = targetTicks',
              'PlayCommand = PlayCommand.PlayNow',
              'CommandTransitCompensation = TimeSpan.FromSeconds(1)',
              'await _sessionManager.SendPlayCommand(',
              'CalculateTargetTicks(',
          ]
          missing = [token for token in required_handoff if token not in coordinator]
          if missing:
              raise SystemExit(f"1.8.1 wall-clock handoff regressed: {missing}")

          # The player queue must come from the Virtual TV schedule, never Jellyfin's
          # automatic same-series Episode expansion.
          required_queue = [
              'ManagedQueueLength = 6',
              'BuildManagedQueue(',
              'ItemIds = queueItemIds',
              'ManagedQueueSourceIds',
              'FindNextPlayableEntry(',
          ]
          missing = [token for token in required_queue if token not in coordinator]
          if missing:
              raise SystemExit(f"Managed schedule queue invariant missing: {missing}")

          # Completion must return authority to the channel clock.
          required_continuity = [
              'HandlePlaybackStopAsync(',
              'eventArgs.PlayedToCompletion',
              'IsAtPhysicalEnd(eventArgs)',
              'completed before scheduled end; return to live',
              'completed away from live boundary; resynchronise to live',
              'ScheduleContinuationFallback(',
              'ContinuationFallbackDelay = TimeSpan.FromMilliseconds(1500)',
              'TransitionPositionTolerance = TimeSpan.FromSeconds(3)',
          ]
          missing = [token for token in required_continuity if token not in coordinator]
          if missing:
              raise SystemExit(f"Channel-continuity invariant missing: {missing}")

          # Manual Back/Stop must end the managed session rather than reopening content.
          if 'EndSession(sessionId, "manual stop")' not in coordinator:
              raise SystemExit("Manual stop must end the Virtual TV session.")

          # The old delayed Live TV Seek architecture remains forbidden.
          forbidden = [
              'SendPlaystateCommand',
              'PlaystateCommand.Seek',
              'FirstSeekDelay',
              'ConfirmationSeekDelay',
              'SendWallClockSeekAsync',
          ]
          present = [token for token in forbidden if token in coordinator]
          if present:
              raise SystemExit(f"Legacy post-start seek logic is still present: {present}")

          # Protect every item placed in the managed queue before it can auto-start.
          required_protection = [
              'IEnumerable<Guid> rootItemIds',
              'foreach (var rootItemId in rootItemIds.Distinct())',
              'PlaybackPositionTicks',
              'data.Played',
              'data.PlayCount',
              'data.LastPlayedDate',
              'SaveUserData(',
              'CancelProtection(sessionId, restore: true)',
          ]
          missing = [token for token in required_protection if token not in protection]
          if missing:
              raise SystemExit(f"Managed-queue state protection missing: {missing}")

          if 'RestoreIfProtected(eventArgs, clearAfterRestore: false)' not in start_consumer:
              raise SystemExit("PlaybackStart must restore protected source state.")
          if 'RestoreIfProtected(eventArgs, clearAfterRestore: false)' not in progress_consumer:
              raise SystemExit("PlaybackProgress must restore protected source state.")
          if 'RestoreIfProtected(eventArgs, clearAfterRestore: false)' not in stop_consumer:
              raise SystemExit("PlaybackStop must restore protected source state before continuity handling.")
          if 'HandlePlaybackStopAsync(eventArgs)' not in stop_consumer:
              raise SystemExit("PlaybackStop consumer must invoke channel continuity handling.")

          required_registrations = [
              'AddSingleton<PlaybackStateProtectionManager>()',
              'AddSingleton<LiveTvPlaybackCoordinator>()',
              'IEventConsumer<PlaybackStartEventArgs>',
              'IEventConsumer<PlaybackProgressEventArgs>',
              'IEventConsumer<PlaybackStopEventArgs>',
          ]
          missing = [token for token in required_registrations if token not in registrator]
          if missing:
              raise SystemExit(f"Playback event registration missing: {missing}")

          # The native channel still resolves the schedule item that is currently on-air.
          required_service = [
              '_scheduleStore.Load(channel.Id)',
              'item.GetStartUtc() <= now',
              'item.GetEndUtc() > now',
              'GetStaticMediaSources(item, false)',
          ]
          missing = [token for token in required_service if token not in service]
          if missing:
              raise SystemExit(f"Live source-selection invariant missing: {missing}")

          print("Virtual TV 1.8.2 playback continuity validations passed.")
          PY

      - name: Validate embedded Virtual TV UI
        shell: bash
        run: |
          DLL="Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll"
          grep -a -q 'data-ui-version="1.8.2.0"' "$DLL"
          grep -a -q 'vtv-channel-table' "$DLL"
          grep -a -q 'vtv-content-card' "$DLL"
          grep -a -q 'background:#15566c' "$DLL"
          echo "Embedded UI validation passed."

      - name: Prepare install package
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/VirtualTV
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll artifact/VirtualTV/
          cp build.yaml artifact/VirtualTV/
          cp meta.json artifact/VirtualTV/

          echo "Package contents:"
          find artifact/VirtualTV -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Upload versioned install package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTV-Jellyfin-12.1-v${{ steps.version.outputs.version }}
          path: artifact/VirtualTV/
          if-no-files-found: error
          retention-days: 90
