name: Build Virtual TV Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: virtualtv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install bootstrap media build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate embedded bootstrap videos
        shell: bash
        run: |
          bash scripts/generate-bootstrap-videos.sh
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-10s.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-bootstrap-black-10s.mp4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Version not found in csproj")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Validate package metadata versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version=(ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot().findtext(".//Version") or "").strip()
          meta_version=str(json.loads(Path("meta.json").read_text(encoding="utf-8")).get("version","")).strip()
          text=Path("build.yaml").read_text(encoding="utf-8")
          m=re.search(r'^version:\s*["\']?([^"\'\s]+)',text,re.MULTILINE)
          build_version=m.group(1) if m else ""
          values={"csproj":version,"meta.json":meta_version,"build.yaml":build_version}
          print(values)
          if version!="1.10.7.0" or len(set(values.values()))!=1:
              raise SystemExit(f"Version mismatch: {values}")
          PY

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj --configuration Release --no-restore

      - name: Validate deterministic playback architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path("Jellyfin.Plugin.VirtualTV/Services/LiveTvPlaybackCoordinator.cs").read_text(encoding="utf-8")
          l=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")
          b=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvBootstrapMediaProvider.cs").read_text(encoding="utf-8")
          pc=Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackProgressConsumer.cs").read_text(encoding="utf-8")

          required=[
              'BootstrapBuffer = TimeSpan.FromSeconds(5)',
              'Interlocked.Increment(ref _nextGeneration)',
              'SemaphoreSlim',
              'context.Token',
              'ItemIds = new[] { itemId }',
              'PlayCommand = PlayCommand.PlayNow',
              'PlaybackPhase.AwaitingBootstrap',
              'PlaybackPhase.BootstrapWaitingForProgress',
              'PlaybackPhase.BootstrapBuffering',
              'PlaybackPhase.AwaitingVod',
              'PlaybackPhase.Vod',
              'ReturnToBootstrapAsync',
              'HandlePlaybackProgressAsync',
              'Starting full five-second buffer now',
              'CompleteBootstrapBufferAsync',
              'five seconds after confirmed loading playback',
              'CurrentVodItemId',
              'PendingVodItemId',
              'CompleteProtection',
          ]
          missing=[x for x in required if x not in c]
          if missing:
              raise SystemExit(f"Playback invariant missing: {missing}")

          forbidden=[
              'ManagedStaticQueueLength',
              'BuildConcreteManagedQueue',
              'ScheduleContinuationFallback',
              'ContinuationFallbackDelay',
              'LgDeferredSeekDelay',
              'SeekLgAfterVodStartAsync',
              'SendPlaystateCommand',
              'PendingDeferredSeekTicks',
              'IsLgWebOsSession',
              'BuildConcreteManagedQueue',
              'ManagedQueueOrder',
          ]
          present=[x for x in forbidden if x in c]
          if present:
              raise SystemExit(f"Legacy multi-command playback returned: {present}")

          for token in [
              'source.SupportsDirectPlay = false',
              'source.SupportsDirectStream = false',
              'source.RunTimeTicks = null',
              '_mediaSourceManager.GetStaticMediaSources',
              'ResolveBootstrapFallback',
          ]:
              if token in l:
                  raise SystemExit(f"Bootstrap still references scheduled media: {token}")

          bootstrap_required=[
              '_bootstrapMedia.CreateLoadingSource()',
              'Loading Virtual TV...',
              'Jellyfin.Plugin.VirtualTV.Assets.Bootstrap.virtualtv-loading-10s.mp4',
              'Jellyfin.Plugin.VirtualTV.Assets.Bootstrap.virtualtv-bootstrap-black-10s.mp4',
              'Path.Combine(_applicationPaths.CachePath, "virtualtv", "bootstrap")',
              'SupportsDirectPlay = true',
              'SupportsDirectStream = true',
              'RunTimeTicks = TimeSpan.FromSeconds(10).Ticks',
              'RequiresOpening = false',
              'RequiresClosing = false',
              'SupportsProbing = false',
              'Type = MediaStreamType.Video',
              'Codec = "h264"',
              'Width = 1280',
              'Height = 720',
              'Type = MediaStreamType.Audio',
              'Codec = "aac"',
              'Channels = 2',
              'SampleRate = 48000',
          ]
          missing=[token for token in bootstrap_required if token not in l+b]
          if missing:
              raise SystemExit(f"Embedded bootstrap invariant missing: {missing}")

          if '_scheduleStore.Load(channel.Id)' in l[l.index('private MediaSourceInfo GetSource'):]:
              raise SystemExit("Live TV bootstrap source must not read the schedule.")
          if '_catalog.Get' in l[l.index('private MediaSourceInfo GetSource'):]:
              raise SystemExit("Live TV bootstrap source must not query content.")
          if 'GetSource(channelId, null, false)' in l or 'GetSource(channelId, streamId, true)' in l:
              raise SystemExit("Live TV bootstrap still uses the old RequiresOpening handshake.")

          start_start=c.index('private Task HandleBootstrapStartAsync')
          start_end=c.index('private void HandleBootstrapStop', start_start)
          start_handler=c[start_start:start_end]
          if 'CompleteBootstrapBufferAsync' in start_handler or 'Task.Delay(BootstrapBuffer' in start_handler:
              raise SystemExit("PlaybackStart must only arm the loading phase; it must not start the five-second timer.")

          if 'HandlePlaybackProgressAsync' not in pc or '_coordinator.HandlePlaybackProgressAsync(eventArgs)' not in pc:
              raise SystemExit("PlaybackProgress consumer is not wired to the bootstrap coordinator.")

          progress_start=c.index('public Task HandlePlaybackProgressAsync')
          progress_end=c.index('public async Task HandlePlaybackStopAsync', progress_start)
          progress_handler=c[progress_start:progress_end]
          if 'PlaybackPhase.BootstrapWaitingForProgress' not in progress_handler or 'PlaybackPhase.BootstrapBuffering' not in progress_handler:
              raise SystemExit("PlaybackProgress does not own the BootstrapWaitingForProgress -> BootstrapBuffering transition.")
          if '_ = CompleteBootstrapBufferAsync(context);' not in progress_handler:
              raise SystemExit("Confirmed progress must start the non-blocking five-second buffer.")

          stop_start=c.index('public async Task HandlePlaybackStopAsync')
          stop_end=c.index('private Task HandleBootstrapStartAsync', stop_start)
          stop_handler=c[stop_start:stop_end]
          if 'PlayScheduledEntryAsync' in stop_handler:
              raise SystemExit("HandlePlaybackStopAsync must not perform a direct VOD-to-VOD handoff.")
          if 'ReturnToBootstrapAsync(context, "physical VOD EOF")' not in stop_handler:
              raise SystemExit("Physical EOF is not routed through the neutral Live TV bootstrap.")

          print("Explicit Bootstrap -> VOD -> Bootstrap playback validation passed.")
          PY

      - name: Validate 1.10.7 scheduling, editing and coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvScheduleGenerator.cs").read_text(encoding="utf-8")
          p=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          a=Path("Jellyfin.Plugin.VirtualTV/Api/ChannelController.cs").read_text(encoding="utf-8")
          v=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvVisibilityManager.cs").read_text(encoding="utf-8")

          required_generator=[
              'BuildSmartAppendWithRotation(channel, startUtc, targetUtc, prefix, resetRandomState: true)',
              'Coverage-first weekly template',
              '_smartOrder[_cursor % _smartOrder.Count]',
              'earlierProgrammeCount / Math.Max(1, channel.EpisodesPerTurn)',
          ]
          missing=[x for x in required_generator if x not in g]
          if missing:
              raise SystemExit(f"Smart coverage missing: {missing}")

          required_ui=[
              'data-ui-version="1.10.7.0"',
              'Content Coverage',
              'data-filter="unassigned"',
              'Export CSV',
              'loadCoverage(true)',
              'String(existing.ChannelType',
              'String(existing.ContentMode',
              'String(existing.SchedulingMethod',
              'Channel settings saved. Generate a new schedule',
          ]
          missing=[x for x in required_ui if x not in p]
          if missing:
              raise SystemExit(f"1.10.7 UI missing: {missing}")

          forbidden_ui=[
              "page.querySelector('#channelType').disabled=true",
              "page.querySelector('#contentMode').disabled=true",
              "page.querySelector('#schedulingMethod').disabled=true",
              "page.querySelector('#movieContentMode').disabled=true",
              'Channel type, playback mode and schedule strategy are structural',
          ]
          present=[x for x in forbidden_ui if x in p]
          if present:
              raise SystemExit(f"Immutable channel UI returned: {present}")

          for token in ['[HttpGet("ContentCoverage")]', 'CoverageItem(', 'CoverageChannel(']:
              if token not in a:
                  raise SystemExit(f"Coverage API missing: {token}")

          guide_tokens=[
              'Virtual TV Guide UI START',
              '.guide-channelHeaderCell-tv,',
              '.channelPrograms-tv {',
              '--vtv-guide-row-height: 8.25rem',
              'height: var(--vtv-guide-row-height) !important',
              'flex: 0 0 var(--vtv-guide-row-height) !important',
              'height: 100% !important',
              'align-items: center !important',
              'font-size: 1.18em !important',
              'width: 27vw !important',
              'SaveConfiguration("branding", branding)',
              'margin-bottom: 0 !important',
              'margin-right: 1px !important',
          ]
          missing=[token for token in guide_tokens if token not in v]
          if missing:
              raise SystemExit(f"Guide UI integration missing: {missing}")

          if 'height: 7.8em !important' in v:
              raise SystemExit("em-based Guide row height unexpectedly remains in 1.10.7")

          if 'width: 18vw !important' in v:
              raise SystemExit("Old Guide column width unexpectedly remains in 1.10.7")

          for token in [
              'vtv-coverage-launcher{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap;margin-top:1.5em}',
              'vtv-coverage-card{border:1px solid rgba(255,255,255,.13);border-radius:.7em;padding:1em;background:#202020;color:#fff!important',
              'vtv-coverage-value{font-size:1.65em;font-weight:800;line-height:1.1;color:#fff!important',
              'vtv-coverage-label{margin-top:.25em;opacity:.78;color:#fff!important',
          ]:
              if token not in p:
                  raise SystemExit(f"Content Coverage dark-mode/spacing invariant missing: {token}")

          print("Scheduling, editable channels, coverage report and Guide UI validation passed.")
          PY

      - name: Validate watched-state rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          policy=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvModePolicy.cs").read_text(encoding="utf-8")
          protection=Path("Jellyfin.Plugin.VirtualTV/Services/PlaybackStateProtectionManager.cs").read_text(encoding="utf-8")
          stop=Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStopConsumer.cs").read_text(encoding="utf-8")
          resolver=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvEpisodeResolver.cs").read_text(encoding="utf-8")

          for token in ['=> IsDynamicUnwatched(mode)', 'CompleteProtection', 'FinalRestoreGrace', 'RestoreAllIfProtected']:
              if token not in policy+protection+stop:
                  raise SystemExit(f"Watched-state invariant missing: {token}")
          for token in ['Where(candidate => !candidate.Played)', 'selected = PickRandom(unwatched, lastItemId)', 'var next = candidates.FirstOrDefault(candidate => !candidate.Played)']:
              if token not in resolver:
                  raise SystemExit(f"Unwatched resolver invariant missing: {token}")
          print("Watched-state validation passed.")
          PY

      - name: Validate Virtual TV configuration JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          start=page.index('<script type="text/javascript">')+len('<script type="text/javascript">')
          end=page.index('</script>',start)
          Path("/tmp/virtualtv-config.js").write_text(page[start:end],encoding="utf-8")
          PY
          node --check /tmp/virtualtv-config.js

      - name: Validate embedded UI and bootstrap media
        shell: bash
        run: |
          DLL="Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll"
          grep -a -q 'data-ui-version="1.10.7.0"' "$DLL"
          grep -a -q 'Content Coverage' "$DLL"
          grep -a -q 'Unassigned' "$DLL"
          grep -a -q 'Generate New Schedule' "$DLL"
          grep -a -q 'virtualtv-loading-10s.mp4' "$DLL"
          grep -a -q 'virtualtv-bootstrap-black-10s.mp4' "$DLL"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          for name in ["virtualtv-loading-10s.mp4", "virtualtv-bootstrap-black-10s.mp4"]:
              path=Path("Jellyfin.Plugin.VirtualTV/Assets/Bootstrap")/name
              if not path.exists() or path.stat().st_size < 10000:
                  raise SystemExit(f"Bootstrap video missing or unexpectedly small: {name}")
              duration=float(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(path)
              ], text=True).strip())
              if not 9.9 <= duration <= 10.1:
                  raise SystemExit(f"Unexpected bootstrap duration for {name}: {duration}")
          PY

          echo "Embedded 1.10.7 UI and 10-second bootstrap media validation passed."

      - name: Prepare install package
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/VirtualTV
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll artifact/VirtualTV/
          cp build.yaml artifact/VirtualTV/
          cp meta.json artifact/VirtualTV/
          unzip -t <(cd artifact && zip -qr - VirtualTV) >/dev/null 2>&1 || true
          find artifact/VirtualTV -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Upload versioned install package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTV-Jellyfin-12.1-v${{ steps.version.outputs.version }}
          path: artifact/VirtualTV/
          if-no-files-found: error
          retention-days: 90
