name: Build Virtual TV Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: virtualtv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Version not found in csproj")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Validate package metadata versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = (root.findtext(".//Version") or "").strip()

          meta = json.loads(Path("meta.json").read_text(encoding="utf-8"))
          meta_version = str(meta.get("version", "")).strip()

          build_text = Path("build.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*["\']?([^"\'\s]+)["\']?\s*$', build_text, re.MULTILINE)
          build_version = match.group(1) if match else ""

          values = {
              "csproj": version,
              "meta.json": meta_version,
              "build.yaml": build_version,
          }

          print("Version check:", values)
          if not version or len(set(values.values())) != 1:
              raise SystemExit(f"Version mismatch: {values}")
          PY

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj --configuration Release --no-restore

      - name: Validate Virtual TV 1.10.2 UI and feature surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")

          page_start = page.index('<div id="VirtualTVConfigPage"')
          content_start = page.index('<div data-role="content">', page_start)
          style_start = page.index('<style>', page_start)
          style_end = page.index('</style>', style_start)

          if not (page_start < style_start < style_end < content_start):
              raise SystemExit("Virtual TV CSS must stay scoped inside the plugin page.")
          if '<style>' in page[:page.index('</head>')]:
              raise SystemExit("Head-level CSS detected.")

          required = [
              'data-ui-version="1.10.2.0"',
              'class="vtv-channel-table"',
              'class="vtv-content-grid"',
              'class="vtv-content-card',
              'background:#15566c',
              'id="seriesOptionsSection"',
              'id="manualOrderSection"',
              'id="moviePlaybackSection"',
              'id="visibilityMode"',
              'id="userSelection"',
              'value="NextUnwatched"',
              'value="RandomUnwatched"',
              'value="SmartSchedule"',
              '<option value="120">120 minutes</option>',
              'Generate New Schedule',
              'Channel type, playback mode and schedule strategy are structural',
              'id="channelDescription"',
              'editorHistoryActive:false',
              'window.history.pushState',
              'window.addEventListener(\'popstate\',handleEditorBack)',
          ]
          missing = [token for token in required if token not in page]
          if missing:
              raise SystemExit(f"Missing 1.10.2 UI tokens: {missing}")

          forbidden = [
              'vtv-channel-card',
              'RandomShuffleCycle',
              "saveConfiguration(function(){\n      closeEditor();\n      renderChannels();\n    },",
          ]
          present = [token for token in forbidden if token in page]
          if present:
              raise SystemExit(f"Obsolete/destructive UI behavior present: {present}")

          print("Virtual TV 1.10.2 UI validation passed.")
          PY

      - name: Validate stable playback foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path("Jellyfin.Plugin.VirtualTV/Services/LiveTvPlaybackCoordinator.cs").read_text(encoding="utf-8")
          resolver = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvEpisodeResolver.cs").read_text(encoding="utf-8")
          protection = Path("Jellyfin.Plugin.VirtualTV/Services/PlaybackStateProtectionManager.cs").read_text(encoding="utf-8")
          stop_consumer = Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStopConsumer.cs").read_text(encoding="utf-8")
          policy = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvModePolicy.cs").read_text(encoding="utf-8")

          concrete = [
              'StartPositionTicks = targetTicks',
              'PlayCommand = PlayCommand.PlayNow',
              'CommandTransitCompensation = TimeSpan.FromSeconds(1)',
              'completed before scheduled end; return to live',
              'completed away from live boundary; resynchronise to live',
              'if (!context.TracksJellyfinState && context.UserId != Guid.Empty)',
              'ManagedStaticQueueLength = 2',
              'NaturalTransitionGrace = TimeSpan.FromSeconds(12)',
              'ContinuationFallbackDelay = TimeSpan.FromSeconds(5)',
              'ignored duplicate channel-start event',
              'managed queue exhausted; start current live programme',
          ]
          missing = [token for token in concrete if token not in coordinator]
          if missing:
              raise SystemExit(f"Stable concrete playback regressed: {missing}")

          dynamic_series = [
              'PlayDynamicSeriesEntryAsync',
              'ResolveEpisode(',
              'var singleEpisode = new[] { resolution.ItemId };',
              'ItemIds = singleEpisode',
              'StartPositionTicks = 0',
              'episode ended; active block is still the same series',
              'episode ended; schedule has moved to another series block',
          ]
          missing = [token for token in dynamic_series if token not in coordinator]
          if missing:
              raise SystemExit(f"Approved 1.9.1 dynamic-series playback regressed: {missing}")

          if 'Where(candidate => !candidate.Played)' not in resolver:
              raise SystemExit("Unwatched selection no longer filters Played=false.")
          if 'var next = candidates.FirstOrDefault(candidate => !candidate.Played)' not in resolver:
              raise SystemExit("Next Unwatched is no longer coverage-first in catalogue order.")
          if 'selected = PickRandom(unwatched, lastItemId)' not in resolver:
              raise SystemExit("Random Unwatched pool selection missing.")

          if '=> IsDynamicUnwatched(mode)' not in policy:
              raise SystemExit("Watched-state policy changed.")
          if 'RestoreAllIfProtected' not in protection or 'RestoreAllIfProtected(eventArgs.Session.Id, eventArgs.PlaySessionId)' not in stop_consumer:
              raise SystemExit("Traditional watched/resume protection regressed.")
          for token in [
              'CompleteProtection',
              'FinalRestoreGrace',
              'PlaySessionIds',
              'IsClosing',
              'data.AudioStreamIndex = state.AudioStreamIndex',
              'data.SubtitleStreamIndex = state.SubtitleStreamIndex',
          ]:
              if token not in protection:
                  raise SystemExit(f"Traditional user-data protection missing: {token}")

          forbidden = [
              'SendPlaystateCommand',
              'PlaystateCommand.Seek',
              'ResolveQueue(',
              'PlayDynamicManagedItemAsync',
              'GetNextManagedQueueItem',
          ]
          present = [token for token in forbidden if token in coordinator or token in resolver]
          if present:
              raise SystemExit(f"Legacy playback architecture returned: {present}")

          print("Stable 1.9.1 playback foundation validation passed.")
          PY

      - name: Validate 1.10.2 schedule and content invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          generator = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvScheduleGenerator.cs").read_text(encoding="utf-8")
          catalog = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvContentCatalog.cs").read_text(encoding="utf-8")
          movie = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvMovieResolver.cs").read_text(encoding="utf-8")
          visibility = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvVisibilityManager.cs").read_text(encoding="utf-8")
          livetv = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")
          channel_config = Path("Jellyfin.Plugin.VirtualTV/Configuration/ChannelConfiguration.cs").read_text(encoding="utf-8")
          registrator = Path("Jellyfin.Plugin.VirtualTV/PluginServiceRegistrator.cs").read_text(encoding="utf-8")
          extend = Path("Jellyfin.Plugin.VirtualTV/Tasks/VirtualTvExtendSchedulesTask.cs").read_text(encoding="utf-8")
          reconcile = Path("Jellyfin.Plugin.VirtualTV/Tasks/VirtualTvReconcileSchedulesTask.cs").read_text(encoding="utf-8")
          recovery = Path("Jellyfin.Plugin.VirtualTV/Tasks/VirtualTvRecoveryTask.cs").read_text(encoding="utf-8")

          content_tokens = [
              'AllSeasons',
              'SelectedSeasonNumbers',
              'IncludeSpecials',
              'HasReliableChronologicalPosition',
              'AirsBeforeSeasonNumber',
              'AirsAfterSeasonNumber',
          ]
          missing = [token for token in content_tokens if token not in catalog]
          if missing:
              raise SystemExit(f"Season/Specials invariant missing: {missing}")

          schedule_tokens = [
              'GenerateNewSchedule',
              'public IReadOnlyList<VirtualTvScheduleEntry> Extend',
              'public IReadOnlyList<VirtualTvScheduleEntry> Reconcile',
              'public IReadOnlyList<VirtualTvScheduleEntry> Recover',
              'HistoryRetention = TimeSpan.FromDays(7)',
              'FutureHorizon = TimeSpan.FromDays(30)',
              'GetNextSundayUtc',
              'GetSundayStartUtc',
              'ShouldRotateSmartTemplate',
              'SmartTemplateCreatedUtc',
              'HasReconcileChanges',
              'ContentFingerprint',
              'FindFirstGapStart',
              'RepeatingSeriesOrder',
              'ShuffleBag',
              'BuildDynamicMovieSchedule',
              'CreateUnavailableEntry',
          ]
          missing = [token for token in schedule_tokens if token not in generator]
          if missing:
              raise SystemExit(f"Schedule lifecycle invariant missing: {missing}")

          movie_tokens = [
              'MaterializedUnwatched',
              'RuntimeUnwatchedReplacement',
              'RandomFallback',
              'PlaybackPositionTicks',
          ]
          missing = [token for token in movie_tokens if token not in movie]
          if missing:
              raise SystemExit(f"Movie Random Unwatched invariant missing: {missing}")

          visibility_tokens = [
              'BlockedChannels',
              'UpdatePolicyAsync',
              'IsVisibleToUser',
              'VisibleToAllUsers',
              'VisibleUserIds',
              'internalChannel.Overview = desiredOverview',
              'ItemUpdateType.MetadataEdit',
          ]
          missing = [token for token in visibility_tokens if token not in visibility]
          if missing:
              raise SystemExit(f"Visibility invariant missing: {missing}")

          presentation_tokens = [
              'public string Description { get; set; } = string.Empty;',
              'GetFrontendChannelNumber',
              '"Channel " + channel.Number.ToString',
              'GetFrontendChannelName',
              '=> "- " + channel.Name',
              'EpisodeTitle = entry.IsMovie || entry.IsDynamicBlock ? null : entry.Name',
          ]
          combined_presentation = channel_config + "\n" + livetv
          missing = [token for token in presentation_tokens if token not in combined_presentation]
          if missing:
              raise SystemExit(f"Channel presentation invariant missing: {missing}")
          if 'FormatEpisodeTitle' in livetv:
              raise SystemExit("Legacy SxxExx EPG formatting returned.")

          task_tokens = [
              ('Extend', extend, ['Virtual TV — Extend Channel Schedules', 'TaskTriggerInfoType.WeeklyTrigger', 'DayOfWeek.Monday', 'TimeSpan.FromHours(3).Ticks']),
              ('Reconcile', reconcile, ['Virtual TV — Reconcile Channel Schedules', 'TaskTriggerInfoType.DailyTrigger', 'TimeSpan.FromHours(5).Ticks']),
              ('Recovery', recovery, ['Virtual TV — Startup Recovery', 'TaskTriggerInfoType.StartupTrigger']),
          ]
          for name, source, tokens in task_tokens:
              missing = [token for token in tokens if token not in source]
              if missing:
                  raise SystemExit(f"{name} task invariant missing: {missing}")

          registrations = [
              'AddSingleton<VirtualTvContentCatalog>()',
              'AddSingleton<VirtualTvMovieResolver>()',
              'AddSingleton<VirtualTvRuntimeFallbackResolver>()',
              'AddSingleton<VirtualTvVisibilityManager>()',
              'AddSingleton<IScheduledTask, VirtualTvExtendSchedulesTask>()',
              'AddSingleton<IScheduledTask, VirtualTvReconcileSchedulesTask>()',
              'AddSingleton<IScheduledTask, VirtualTvRecoveryTask>()',
          ]
          missing = [token for token in registrations if token not in registrator]
          if missing:
              raise SystemExit(f"1.10.2 service registration missing: {missing}")

          if Path("Jellyfin.Plugin.VirtualTV/Tasks/VirtualTvSmartScheduleRefreshTask.cs").exists():
              raise SystemExit("Obsolete Smart-only refresh task must not return; Smart rotation belongs to Extend.")

          print("Virtual TV 1.10.2 content, lifecycle, task and visibility validations passed.")
          PY

      - name: Validate 1.10.2 LG webOS compatibility path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path("Jellyfin.Plugin.VirtualTV/Services/LgWebOsLivePlaybackManager.cs").read_text(encoding="utf-8")
          livetv = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")
          start_consumer = Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStartConsumer.cs").read_text(encoding="utf-8")
          stop_consumer = Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStopConsumer.cs").read_text(encoding="utf-8")
          registrator = Path("Jellyfin.Plugin.VirtualTV/PluginServiceRegistrator.cs").read_text(encoding="utf-8")
          visibility = Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvVisibilityManager.cs").read_text(encoding="utf-8")
          page = Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")

          required = {
              "LG manager": (manager, [
                  "TryHandlePlaybackStartAsync",
                  "TryHandlePlaybackStopAsync",
                  "IsLgWebOsSession",
                  "VirtualTvModePolicy.IsDynamicUnwatched(contentMode)",
                  "StartPositionTicks = 0",
                  "PlayCommand = PlayCommand.PlayNow",
                  "NaturalEndTolerance",
              ]),
              "rebased Live TV source": (livetv, [
                  "CreateRebasedInput",
                  "source.EncoderPath = rebasedInput.DescriptorPath",
                  "source.EncoderProtocol = MediaProtocol.File",
                  'Path.Combine(_applicationPaths.CachePath, "virtualtv", "live-rebase")',
                  '"ffconcat version 1.0\\n"',
                  '"inpoint " + offset.TotalSeconds.ToString',
                  "source.RunTimeTicks = null",
              ]),
              "start routing": (start_consumer, ["TryHandlePlaybackStartAsync"]),
              "stop routing": (stop_consumer, ["TryHandlePlaybackStopAsync"]),
              "service registration": (registrator, ["AddSingleton<LgWebOsLivePlaybackManager>()"]),
              "description fallback": (visibility + "\n" + page, [
                  "var desiredOverview = string.Empty;",
                  'id="channelDescription" type="hidden"',
              ]),
          }

          for area, (source, tokens) in required.items():
              missing = [token for token in tokens if token not in source]
              if missing:
                  raise SystemExit(f"{area} validation missing: {missing}")

          print("Virtual TV 1.10.2 LG webOS and description fallback validation passed.")
          PY

      - name: Validate Virtual TV configuration JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          start = page.index('<script type="text/javascript">') + len('<script type="text/javascript">')
          end = page.index('</script>', start)
          Path("/tmp/virtualtv-config.js").write_text(page[start:end], encoding="utf-8")
          PY
          node --check /tmp/virtualtv-config.js
          echo "Virtual TV configuration JavaScript syntax validation passed."

      - name: Validate embedded Virtual TV UI
        shell: bash
        run: |
          DLL="Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll"
          grep -a -q 'data-ui-version="1.10.2.0"' "$DLL"
          grep -a -q 'class="vtv-channel-table"' "$DLL"
          grep -a -q 'class="vtv-content-card' "$DLL"
          grep -a -q 'id="seriesOptionsSection"' "$DLL"
          grep -a -q 'id="manualOrderSection"' "$DLL"
          grep -a -q 'id="moviePlaybackSection"' "$DLL"
          grep -a -q 'id="visibilityMode"' "$DLL"
          grep -a -q 'value="NextUnwatched"' "$DLL"
          grep -a -q 'value="RandomUnwatched"' "$DLL"
          grep -a -q 'value="SmartSchedule"' "$DLL"
          grep -a -q 'background:#15566c' "$DLL"
          echo "Embedded 1.10.2 UI validation passed."

      - name: Prepare install package
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/VirtualTV
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll artifact/VirtualTV/
          cp build.yaml artifact/VirtualTV/
          cp meta.json artifact/VirtualTV/

          echo "Package contents:"
          find artifact/VirtualTV -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Upload versioned install package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTV-Jellyfin-12.1-v${{ steps.version.outputs.version }}
          path: artifact/VirtualTV/
          if-no-files-found: error
          retention-days: 90
