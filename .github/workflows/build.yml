name: Build Virtual TV Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub/Jellyfin full release"
        required: true
        default: false
        type: boolean

concurrency:
  group: virtualtv-build-${{ github.ref }}-${{ github.event_name == 'push' && github.event.head_commit.message == 'Publish authorized Virtual TV 2.0.1.0' && 'release' || 'normal' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install bootstrap media build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive timeout 600s             apt-get update             -o Acquire::Retries=5             -o Acquire::http::Timeout=30             -o Acquire::https::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive timeout 600s             apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Generate and validate embedded bootstrap media
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-bootstrap-videos.sh

          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1             Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-10s.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1             Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-bootstrap-black-10s.mp4
          ffprobe -v error -show_entries format=format_name,duration -of default=nw=1             Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-live-60s.ts

          ffmpeg -hide_banner -loglevel error -nostdin -re             -i Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-live-60s.ts             -t 2 -map 0:v:0 -map 0:a:0 -c copy -f null -

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Version not found in csproj")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Validate package metadata versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version=(ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot().findtext(".//Version") or "").strip()
          meta_version=str(json.loads(Path("meta.json").read_text(encoding="utf-8")).get("version","")).strip()
          text=Path("build.yaml").read_text(encoding="utf-8")
          m=re.search(r'^version:\s*["\']?([^"\'\s]+)',text,re.MULTILINE)
          build_version=m.group(1) if m else ""
          values={"csproj":version,"meta.json":meta_version,"build.yaml":build_version}
          print(values)
          if version!="2.0.1.0" or len(set(values.values()))!=1:
              raise SystemExit(f"Version mismatch: {values}")

          manifest=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          if not isinstance(manifest,list) or len(manifest)!=1:
              raise SystemExit("Repository manifest must contain exactly one Virtual TV package.")
          package=manifest[0]
          if package.get("guid")!="2b7187ae-6dcd-4f8c-a9bc-5e2f6df8d3c1":
              raise SystemExit("Repository manifest GUID does not match Virtual TV.")
          if package.get("owner")!="R-BCK-gitgub":
              raise SystemExit("Repository manifest owner must be R-BCK-gitgub.")
          versions=package.get("versions") or []
          if not any(v.get("version")=="2.0.1.0" and v.get("targetAbi")=="12.1.0.0" for v in versions):
              raise SystemExit("Repository manifest is missing the Jellyfin 12.1 Virtual TV 2.0 release.")
          print("Full-release repository manifest metadata validation passed.")
          PY

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj --configuration Release --no-restore

      - name: Validate deterministic playback architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path("Jellyfin.Plugin.VirtualTV")
          c=(root/"Services/LiveTvPlaybackCoordinator.cs").read_text()
          e=(root/"Services/VirtualTvEpisodeResolver.cs").read_text()
          m=(root/"Services/VirtualTvMovieResolver.cs").read_text()
          reg=(root/"PluginServiceRegistrator.cs").read_text()
          stop=(root/"Events/VirtualTvPlaybackStopConsumer.cs").read_text()

          # Baseline architecture: one Personalized VOD startup implementation for every mode.
          required=[
              'BootstrapBuffer = TimeSpan.FromSeconds(2)',
              'private async Task SendIsolatedVodPlayNowAsync(',
              'ItemIds = new[] { itemId }',
              'StartPositionTicks = 1L',
              'StartIndex = 0',
              'PlayCommand = PlayCommand.PlayNow',
              'SessionMessageType.Play',
              'queue length 1',
              'PrepareVodHandoff(context, entry, sourceItemId, 0)',
              'reason + "; concrete Personalized TV"',
              'CompleteResumeSeekAsync',
              'await ReturnToBootstrapAsync(context, "physical VOD EOF")',
          ]
          missing=[x for x in required if x not in c]
          if missing:
              raise SystemExit(f"Personalized baseline invariant missing: {missing}")

          # No second/special traditional startup path is allowed.
          forbidden=[
              'omitStartPosition',
              'StartPositionTicks = null',
              'isolatedStartTicks',
              'requestedStartTicks',
              'PlaybackStateProtectionManager',
              'TracksJellyfinState',
              'BeginProtection',
              'CompleteProtection',
              'RestoreStoppedItem',
              'GridSeek',
              'WallClock',
              'CalculateConcreteTargetTicks',
              'BootstrapFirstProgressUtc',
              'BootstrapFirstProgressTicks',
              'CurrentEntryId',
              'public string ChannelType { get; }',
          ]
          present=[x for x in forbidden if x in c+reg+stop]
          if present:
              raise SystemExit(f"Obsolete/special playback logic remains: {present}")

          if c.count('private async Task SendIsolatedVodPlayNowAsync(') != 1:
              raise SystemExit("Personalized VOD startup implementation is duplicated.")
          if c.count('_sessionManager.SendPlaystateCommand(') != 2:
              raise SystemExit("Personalized playback must have exactly two automatic Playstate commands: guarded Resume seek and Android-mobile loading Stop.")

          for token in [
              'private const string AndroidMobileClient = "Jellyfin for Android";',
              'PlaybackStart is sufficient, starting the 2-second loading buffer immediately.',
              'Command = PlaystateCommand.Stop',
              'AndroidPlayerTeardownBuffer = TimeSpan.FromSeconds(1)',
              'context.IsAndroidMobile',
          ]:
              if token not in c:
                  raise SystemExit(f"Android mobile handoff invariant missing: {token}")

          # Traditional Personalized: Guide selects item, pending Resume is zero, same PlayNow.
          concrete_start=c.index('private async Task PlayConcreteEntryAsync')
          concrete_end=c.index('private async Task PlayTraditionalFallbackAsync',concrete_start)
          concrete=c[concrete_start:concrete_end]
          for token in [
              'PrepareVodHandoff(context, entry, sourceItemId, 0)',
              'SendIsolatedVodPlayNowAsync(',
              'sourceItemId,\n            0,',
          ]:
              if token not in concrete:
                  raise SystemExit(f"Traditional Personalized does not use common VOD path: {token}")
          for forbidden in ['SendPlaystateCommand','PlaybackPositionTicks','Played','PlayCount','Task.Delay']:
              if forbidden in concrete:
                  raise SystemExit(f"Traditional Personalized has unexpected post-selection logic: {forbidden}")

          # Next/Random Unwatched: item-selection + Resume semantics unchanged.
          for token in [
              '"NextResume"',
              '"RandomResume"',
              'startTicks = selected.PlaybackPositionTicks',
              'selected = PickRandom(resumable, lastItemId)',
              'selected = resumable[0]',
          ]:
              if token not in e:
                  raise SystemExit(f"Series Resume-first invariant missing: {token}")
          for token in ['"RandomResume"','resume.PlaybackPositionTicks']:
              if token not in m:
                  raise SystemExit(f"Movie Resume-first invariant missing: {token}")

          # No metadata-rewrite service may return.
          if (root/"Services/PlaybackStateProtectionManager.cs").exists():
              raise SystemExit("Obsolete metadata-protection source still exists.")

          # EOF remains authoritative and re-enters via Loading/Guide, not a VOD queue.
          for token in [
              'if (!IsAtPhysicalEnd(eventArgs))',
              'await ReturnToBootstrapAsync(context, "physical VOD EOF")',
              'FindActiveEntry(LoadSchedule(context.ChannelId), nowUtc)',
          ]:
              if token not in c:
                  raise SystemExit(f"EOF re-entry invariant missing: {token}")

          print("Single Personalized VOD startup path and unchanged Resume/EOF invariants passed.")
          PY

      - name: Validate 2.0 full-release scheduling, editing and coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          g=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvScheduleGenerator.cs").read_text(encoding="utf-8")
          p=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          a=Path("Jellyfin.Plugin.VirtualTV/Api/ChannelController.cs").read_text(encoding="utf-8")
          v=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvVisibilityManager.cs").read_text(encoding="utf-8")
          livetv=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")
          standard=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvStandardStreamService.cs").read_text(encoding="utf-8")
          channel_config=Path("Jellyfin.Plugin.VirtualTV/Configuration/ChannelConfiguration.cs").read_text(encoding="utf-8")
          android_filter=Path("Jellyfin.Plugin.VirtualTV/Services/AndroidTvChannelVisibilityFilter.cs").read_text(encoding="utf-8")

          required_generator=[
              'BuildSmartAppendWithRotation(channel, startUtc, targetUtc, prefix, resetRandomState: true)',
              'Coverage-first weekly template',
              '_smartOrder[_cursor % _smartOrder.Count]',
              'earlierProgrammeCount / Math.Max(1, channel.EpisodesPerTurn)',
              'channel.PlaybackExperience = VirtualTvModePolicy.NormalizePlaybackExperience(channel.PlaybackExperience)',
              'var standardTv = VirtualTvModePolicy.IsStandardTV(channel.PlaybackExperience)',
              '? VirtualTvModePolicy.Random',
              '? (string.Equals(channel.ContentMode, VirtualTvModePolicy.Random',
              'VirtualTvModePolicy.NormalizePlaybackExperience(channel.PlaybackExperience)',
          ]
          missing=[x for x in required_generator if x not in g]
          if missing:
              raise SystemExit(f"Scheduling invariant missing: {missing}")

          required_ui=[
              'data-ui-version="2.0.1.0"',
              'id="channelExperience"',
              '<option value="PersonalizedTV">Personalized TV</option>',
              '<option value="StandardTV">Standard TV</option>',
              'function updateExperienceModeOptions()',
              "standard\n          ? [['Sequential','Sequential'],['Random','Random']]",
              "standard\n          ? [['Random','Random / Shuffle Cycle']]",
              "c.PlaybackExperience=c.PlaybackExperience==='StandardTV'?'StandardTV':'PersonalizedTV'",
              "existing.PlaybackExperience=experience",
              "String(existing.PlaybackExperience||'PersonalizedTV')!==String(experience)",
              "isWatchedDependentMode(experience,type,contentMode)",
              'Resume-first: resumes the earliest chronologically eligible partial episode',
              'Resume-first: randomly chooses among partially watched episodes',
              '<option value="15">15 minutes</option>',
              'Content Coverage',
              'data-filter="unassigned"',
              'Export CSV',
              'loadCoverage(true)',
              'Channel settings saved. Generate a new schedule',
              'id="standardTvResolution"',
              '<option value="480">480p</option>',
              '<option value="720">720p</option>',
              '<option value="1080">1080p</option>',
              'Clone Channel',
              "openEditor(b.getAttribute('data-id'),true)",
              'id="hideFromAndroidTv"',
              'Hide from Android TV',
              "page.querySelector('#androidTvCompatibilityContainer').style.display=standard?'none':''",
              'existing.HideFromAndroidTv=hideFromAndroidTv',
          ]
          missing=[x for x in required_ui if x not in p]
          if missing:
              raise SystemExit(f"2.0 full-release UI missing: {missing}")

          forbidden_ui=[
              "page.querySelector('#channelType').disabled=true",
              "page.querySelector('#contentMode').disabled=true",
              "page.querySelector('#schedulingMethod').disabled=true",
              "page.querySelector('#movieContentMode').disabled=true",
          ]
          present=[x for x in forbidden_ui if x in p]
          if present:
              raise SystemExit(f"Unexpected immutable channel UI: {present}")

          for token in ['[HttpGet("ContentCoverage")]', 'CoverageItem(', 'CoverageChannel(']:
              if token not in a:
                  raise SystemExit(f"Coverage API missing: {token}")

          # Standard TV reuses Jellyfin's native Record control as Play from Beginning.
          # Both single-program and Android TV series-record paths must converge on the same
          # normal Jellyfin PlayNow command, with no DVR timer and no Personalized-TV queue.
          restart_required=[
              'private async Task PlayFromBeginningFromRecordActionAsync(',
              'CreateTimerAsync(TimerInfo info',
              'CreateSeriesTimerAsync(SeriesTimerInfo info',
              '"Record / Just this once"',
              '"Record series"',
              'VirtualTvModePolicy.IsStandardTV(channel.PlaybackExperience)',
              'IHttpContextAccessor',
              'IAuthorizationContext',
              'auth.DeviceId',
              'session.DeviceId',
              'ResolveRecordActionEntry',
              'StartPositionTicks = 0L',
              'PlayCommand = PlayCommand.PlayNow',
              '_sessionManager.SendPlayCommand(',
              'No DVR timer is created',
              'ISupportsNewTimerIds',
              'CreateSyntheticRecordActionId',
          ]
          missing=[x for x in restart_required if x not in livetv]
          if missing:
              raise SystemExit(f"Standard TV Record-to-PlayFromBeginning invariant missing: {missing}")

          if 'SendIsolatedVodPlayNowAsync(' in livetv:
              raise SystemExit("Standard TV Record shortcut must not use the Personalized-TV isolated VOD queue.")

          for token in [
              'public int StandardTvResolution { get; set; } = 720;',
              'ResolveVideoProfile(channel.StandardTvResolution)',
              '480 => new StandardTvVideoProfile(854, 480, 2_000_000',
              '1080 => new StandardTvVideoProfile(1920, 1080, 8_000_000',
              '$"scale={_videoProfile.Width}:{_videoProfile.Height}:force_original_aspect_ratio=decrease,"',
          ]:
              if token not in channel_config+standard:
                  raise SystemExit(f"Standard TV quality profile invariant missing: {token}")

          for token in [
              'public bool HideFromAndroidTv { get; set; }',
              'IAsyncResultFilter',
              'Jellyfin for Android TV',
              'ShouldHideChannel',
              'GetAuthorizationInfo(context.HttpContext)',
          ]:
              if token not in channel_config+android_filter:
                  raise SystemExit(f"Android TV visibility invariant missing: {token}")

          if 'Configure<MvcOptions>' not in Path("Jellyfin.Plugin.VirtualTV/PluginServiceRegistrator.cs").read_text(encoding="utf-8"):
              raise SystemExit("Android TV response visibility filter is not registered globally.")

          # Channel labels must be canonical. Guide styling may change typography only;
          # Jellyfin's stock row/cell/channel geometry must remain untouched.
          for token in [
              'Name = channel.Name,',
              'Number = channel.Number.ToString(CultureInfo.InvariantCulture),',
          ]:
              if token not in livetv:
                  raise SystemExit(f"Canonical channel label invariant missing: {token}")

          for token in [
              'GetFrontendChannelName',
              'GetFrontendChannelNumber',
              '"Channel " + channel.Number.ToString',
              '=> "- " + channel.Name',
          ]:
              if token in livetv:
                  raise SystemExit(f"Legacy channel label formatting returned: {token}")

          guide_text_required=[
              'EnsureGuideTextPresentation();',
              'private void EnsureGuideTextPresentation()',
              'RemoveCssBlock(existing, LegacyGuideCssStart, LegacyGuideCssEnd)',
              'Virtual TV Guide Text UI START',
              '.guideProgramNameText',
              'font-size: .82em !important',
              'white-space: normal !important',
              '-webkit-line-clamp: 2 !important',
              '.guideChannelNumber,',
              '.guideChannelName',
              'font-size: .80em !important',
              'SaveConfiguration("branding", branding)',
          ]
          missing=[x for x in guide_text_required if x not in v]
          if missing:
              raise SystemExit(f"Guide text-only polish missing: {missing}")

          forbidden_guide_geometry=[
              '--vtv-guide-row-height',
              '--vtv-guide-row-gap',
              '.guide-channelHeaderCell',
              '.guide-channelHeaderCell-tv',
              '.channelPrograms',
              '.channelPrograms-tv',
              '.programCell',
              '.guideChannelImage',
              'width: 27vw',
              'height: var(--vtv-guide-row-height)',
              'margin-top: var(--vtv-guide-row-gap)',
              'width: 50% !important',
              'top: 8% !important',
              'bottom: 8% !important',
              'padding-left: .75em !important',
              'max-width: 38% !important',
              'max-width: 60% !important',
          ]
          present=[x for x in forbidden_guide_geometry if x in v]
          if present:
              raise SystemExit(f"Virtual TV is overriding Jellyfin Guide geometry: {present}")

          for token in [
              'vtv-coverage-launcher{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap;margin-top:1.5em}',
              'vtv-coverage-card{border:1px solid rgba(255,255,255,.13);border-radius:.7em;padding:1em;background:#202020;color:#fff!important',
              'vtv-coverage-value{font-size:1.65em;font-weight:800;line-height:1.1;color:#fff!important',
              'vtv-coverage-label{margin-top:.25em;opacity:.78;color:#fff!important',
          ]:
              if token not in p:
                  raise SystemExit(f"Content Coverage UI invariant missing: {token}")

          selection=Path("Jellyfin.Plugin.VirtualTV/Configuration/SeriesSelectionConfiguration.cs").read_text(encoding="utf-8")
          mode=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvModePolicy.cs").read_text(encoding="utf-8")

          for token in [
              'public int Weight { get; set; } = 1;',
              'public const string TrueRandom = "TrueRandom";',
              'NormalizeSeriesWeight',
          ]:
              if token not in selection+mode:
                  raise SystemExit(f"True Random configuration invariant missing: {token}")

          for token in [
              'VirtualTvModePolicy.TrueRandom',
              '_weightedRandom.Add((item, weight))',
              '_totalWeight += weight',
              'Random.Shared.Next(_totalWeight)',
              'ticket < cumulative',
              'S:{series.Id:N}:W:{weight}',
          ]:
              if token not in g:
                  raise SystemExit(f"True Random scheduler invariant missing: {token}")

          for token in [
              '<option value="TrueRandom">True Random</option>',
              "value==='TrueRandom'",
              "method==='TrueRandom'",
              'class="seriesWeightInput"',
              'Weight 2 is twice as likely as Weight 1.',
              'Weight:Math.max(1,Math.min(100,parseInt(x.Weight,10)||1))',
          ]:
              if token not in p:
                  raise SystemExit(f"True Random UI invariant missing: {token}")

          print("Scheduling, True Random weights, Standard TV Record-to-PlayFromBeginning, canonical channel labels, text-only Guide polish and Coverage validation passed.")
          PY

      - name: Validate watched-state rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path("Jellyfin.Plugin.VirtualTV")
          runtime=[
              root/"Services/LiveTvPlaybackCoordinator.cs",
              root/"Services/VirtualTvModePolicy.cs",
              root/"PluginServiceRegistrator.cs",
              root/"Events/VirtualTvPlaybackStartConsumer.cs",
              root/"Events/VirtualTvPlaybackProgressConsumer.cs",
              root/"Events/VirtualTvPlaybackStopConsumer.cs",
          ]
          combined="\n".join(path.read_text() for path in runtime)

          if (root/"Services/PlaybackStateProtectionManager.cs").exists():
              raise SystemExit("Obsolete metadata-protection source still exists.")

          for forbidden in [
              'PlaybackStateProtectionManager',
              'TracksJellyfinState',
              'BeginProtection',
              'CompleteProtection',
              'RestoreStoppedItem',
              'RestoreIfProtected',
              'RestoreAllIfProtected',
              'SaveUserData',
          ]:
              if forbidden in combined:
                  raise SystemExit(f"Obsolete metadata-protection reference remains: {forbidden}")

          print("Jellyfin owns VOD Watched/Resume metadata; plugin has no rewrite layer.")
          PY

      - name: Validate Virtual TV configuration JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          start=page.index('<script type="text/javascript">')+len('<script type="text/javascript">')
          end=page.index('</script>',start)
          Path("/tmp/virtualtv-config.js").write_text(page[start:end],encoding="utf-8")
          PY
          node --check /tmp/virtualtv-config.js

      - name: Smoke-test Standard TV ffmpeg profile
        shell: bash
        run: |
          cat > /tmp/virtualtv-en.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:05,000
          Virtual TV English subtitle smoke test
          EOF

          ffmpeg -hide_banner -loglevel error -nostdin -y             -ss 1 -i Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-10s.mp4             -t 1             -vf "subtitles=filename='/tmp/virtualtv-en.srt',scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30,format=yuv420p"             -map 0:v:0 -map 0:a:0             -c:v libx264 -preset ultrafast -profile:v main -pix_fmt yuv420p             -g 60 -keyint_min 60 -sc_threshold 0             -c:a aac -b:a 160k -ac 2 -ar 48000             -mpegts_flags +resend_headers -muxdelay 0 -muxpreload 0             -f mpegts /tmp/virtualtv-standard-smoke.ts

          python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_streams","-of","json",
              "/tmp/virtualtv-standard-smoke.ts"
          ], text=True))
          streams=data.get("streams",[])
          video=next((x for x in streams if x.get("codec_type")=="video"),None)
          audio=next((x for x in streams if x.get("codec_type")=="audio"),None)
          if not video or video.get("codec_name")!="h264":
              raise SystemExit(f"Standard TV smoke output has no H.264 video: {video}")
          if video.get("width")!=1280 or video.get("height")!=720:
              raise SystemExit(f"Standard TV smoke output is not 1280x720: {video.get('width')}x{video.get('height')}")
          if not audio or audio.get("codec_name")!="aac":
              raise SystemExit(f"Standard TV smoke output has no AAC audio: {audio}")
          print("Standard TV H.264/AAC MPEG-TS + English subtitle burn-in smoke test passed.")
          PY

      - name: Validate embedded UI and bootstrap media
        shell: bash
        run: |
          set -euo pipefail
          DLL="Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll"
          grep -a -q 'data-ui-version="2.0.1.0"' "$DLL"
          grep -a -q 'Content Coverage' "$DLL"
          grep -a -q 'Unassigned' "$DLL"
          grep -a -q 'Generate New Schedule' "$DLL"
          grep -a -q 'virtualtv-loading-10s.mp4' "$DLL"
          grep -a -q 'virtualtv-bootstrap-black-10s.mp4' "$DLL"
          grep -a -q 'virtualtv-loading-live-60s.ts' "$DLL"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          for name in ["virtualtv-loading-10s.mp4", "virtualtv-bootstrap-black-10s.mp4"]:
              path=Path("Jellyfin.Plugin.VirtualTV/Assets/Bootstrap")/name
              if not path.exists() or path.stat().st_size < 10000:
                  raise SystemExit(f"Bootstrap video missing or unexpectedly small: {name}")
              duration=float(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(path)
              ], text=True).strip())
              if not 9.9 <= duration <= 10.1:
                  raise SystemExit(f"Unexpected bootstrap duration for {name}: {duration}")

          live=Path("Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-live-60s.ts")
          if not live.exists() or live.stat().st_size < 100000:
              raise SystemExit("Live MPEG-TS bootstrap is missing or unexpectedly small.")
          duration=float(subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=nw=1:nk=1",str(live)
          ], text=True).strip())
          if not 59.5 <= duration <= 60.5:
              raise SystemExit(f"Unexpected live bootstrap duration: {duration}")
          fmt=subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=format_name",
              "-of","default=nw=1:nk=1",str(live)
          ], text=True).strip()
          if "mpegts" not in fmt:
              raise SystemExit(f"Live bootstrap is not MPEG-TS: {fmt}")
          PY

          echo "Embedded 2.0 full-release UI, MP4 fallbacks and 60-second MPEG-TS Personalized bootstrap validation passed."

      - name: Prepare install package
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/VirtualTV
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll artifact/VirtualTV/
          cp build.yaml artifact/VirtualTV/
          cp meta.json artifact/VirtualTV/
          cp manifest.json artifact/VirtualTV/
          unzip -t <(cd artifact && zip -qr - VirtualTV) >/dev/null 2>&1 || true
          find artifact/VirtualTV -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Upload versioned install package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTV-Jellyfin-12.1-v${{ steps.version.outputs.version }}
          path: artifact/VirtualTV/
          if-no-files-found: error
          retention-days: 90


      - name: Publish GitHub full release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Publish authorized Virtual TV 2.0.1.0')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ZIP="VirtualTV-Jellyfin-12.1-v${VERSION}.zip"
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TARGET="$(git rev-parse HEAD^)"
          else
            RELEASE_TARGET="${GITHUB_SHA}"
          fi

          # Jellyfin repository packages must place the plugin files at the root of the ZIP.
          # Fixed timestamps + zip -X keep the package checksum stable across documentation-only builds.
          rm -rf release-package
          mkdir -p release-package
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll release-package/
          cp meta.json release-package/
          TZ=UTC touch -t 198001010000.00 release-package/Jellyfin.Plugin.VirtualTV.dll release-package/meta.json
          (
            cd release-package
            zip -X -q "../${ZIP}" Jellyfin.Plugin.VirtualTV.dll meta.json
          )
          unzip -t "${ZIP}"
          unzip -l "${ZIP}"

          CHECKSUM="$(md5sum "${ZIP}" | awk '{print $1}')"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"

          cat > /tmp/virtualtv-release-notes.md <<'EOF'
          # Virtual TV 2.0.1

          Virtual TV 2.0.1.0 is a maintenance update for Jellyfin 12.1 that adds configurable Standard TV quality, channel cloning, Android TV compatibility controls and an Android phone/tablet-specific Personalized TV handoff.

          It turns movies and TV shows already available in Jellyfin into custom Live TV-style channels, with both traditional scheduled playback and personalized viewing modes.

          ## Highlights

          - Standard TV and Personalized TV channel experiences
          - Standard TV quality selectable per channel: 480p, 720p or 1080p
          - Clone Channel to create a new channel from an existing configuration
          - Android TV compatibility handling for Standard TV Play from Beginning
          - Optional Hide from Android TV for Personalized channels
          - Android phone/tablet-specific Personalized TV handoff
          - Web and webOS Personalized TV behavior remains unchanged
          - Sequential, Random and weighted True Random playback
          - Next Unwatched and Random Unwatched modes
          - Resume-first behaviour for partially watched content
          - Flexible scheduling and programme blocks
          - Per-user channel visibility
          - Content Coverage reporting
          - Jellyfin Live TV Guide integration
          - Start the current Standard TV programme from the beginning

          ## Installation

          The recommended method is to add the Virtual TV repository to Jellyfin and install the plugin directly from **Dashboard → Plugins → Catalog**.

          Repository URL:

          `https://raw.githubusercontent.com/R-BCK-gitgub/jellyfin-plugin-virtualtv/main/manifest.json`

          Manual installation is also supported using the ZIP attached to this release.

          Scheduling rules remain unchanged from 2.0.0. Personalized TV now has client-specific compatibility handling for Jellyfin for Android while Web and webOS retain the existing handoff.
          EOF

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag -f "${TAG}" "${RELEASE_TARGET}"
            git push origin "refs/tags/${TAG}" --force
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "Virtual TV v${VERSION}" --notes-file /tmp/virtualtv-release-notes.md --latest
          else
            gh release create "${TAG}" "${ZIP}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_TARGET}" \
              --title "Virtual TV v${VERSION}" \
              --notes-file /tmp/virtualtv-release-notes.md \
              --latest
          fi

          python3 - "${VERSION}" "${SOURCE_URL}" "${CHECKSUM}" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, source_url, checksum = sys.argv[1:4]
          path = Path("manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          matches = [
              item
              for package in data
              for item in package.get("versions", [])
              if item.get("version") == version
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one manifest entry for {version}, found {len(matches)}")

          entry = matches[0]
          entry["sourceUrl"] = source_url
          entry["checksum"] = checksum
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"Jellyfin repository package: {source_url}")
          print(f"Jellyfin repository MD5: {checksum}")
          PY

          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Update Jellyfin repository package metadata for v${VERSION}"
            git push origin HEAD:main
          else
            echo "manifest.json already points to the current release package and checksum."
          fi
