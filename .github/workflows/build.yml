name: Build Virtual TV Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: virtualtv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Version not found in csproj")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Validate package metadata versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version=(ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot().findtext(".//Version") or "").strip()
          meta_version=str(json.loads(Path("meta.json").read_text(encoding="utf-8")).get("version","")).strip()
          text=Path("build.yaml").read_text(encoding="utf-8")
          m=re.search(r'^version:\s*["\']?([^"\'\s]+)',text,re.MULTILINE)
          build_version=m.group(1) if m else ""
          values={"csproj":version,"meta.json":meta_version,"build.yaml":build_version}
          print(values)
          if version!="1.10.4.0" or len(set(values.values()))!=1:
              raise SystemExit(f"Version mismatch: {values}")
          PY

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj --configuration Release --no-restore

      - name: Validate deterministic playback architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path("Jellyfin.Plugin.VirtualTV/Services/LiveTvPlaybackCoordinator.cs").read_text(encoding="utf-8")
          l=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")

          required=[
              'InitialHandoffDelay = TimeSpan.FromMilliseconds(500)',
              'Interlocked.Increment(ref _nextGeneration)',
              'SemaphoreSlim',
              'context.Token',
              'ItemIds = new[] { itemId }',
              'PlayCommand = PlayCommand.PlayNow',
              'physical EOF; re-resolve current schedule',
              'ignored stale source start',
              'PendingTargetItemId',
              'CompleteProtection',
          ]
          missing=[x for x in required if x not in c]
          if missing:
              raise SystemExit(f"Playback invariant missing: {missing}")

          forbidden=[
              'ManagedStaticQueueLength',
              'BuildConcreteManagedQueue',
              'ScheduleContinuationFallback',
              'ContinuationFallbackDelay',
              'LgDeferredSeekDelay',
              'SeekLgAfterVodStartAsync',
              'SendPlaystateCommand',
              'PendingDeferredSeekTicks',
              'IsLgWebOsSession',
          ]
          present=[x for x in forbidden if x in c]
          if present:
              raise SystemExit(f"Legacy multi-command playback returned: {present}")

          for token in [
              'source.SupportsDirectPlay = false',
              'source.SupportsDirectStream = false',
              'source.RunTimeTicks = null',
          ]:
              if token in l:
                  raise SystemExit(f"Bootstrap still forces legacy Live TV media behavior: {token}")

          print("Deterministic single-PlayNow playback validation passed.")
          PY

      - name: Validate 1.10.4 scheduling, editing and coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvScheduleGenerator.cs").read_text(encoding="utf-8")
          p=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          a=Path("Jellyfin.Plugin.VirtualTV/Api/ChannelController.cs").read_text(encoding="utf-8")
          v=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvVisibilityManager.cs").read_text(encoding="utf-8")

          required_generator=[
              'BuildSmartAppendWithRotation(channel, startUtc, targetUtc, prefix, resetRandomState: true)',
              'Coverage-first weekly template',
              '_smartOrder[_cursor % _smartOrder.Count]',
              'earlierProgrammeCount / Math.Max(1, channel.EpisodesPerTurn)',
          ]
          missing=[x for x in required_generator if x not in g]
          if missing:
              raise SystemExit(f"Smart coverage missing: {missing}")

          required_ui=[
              'data-ui-version="1.10.4.0"',
              'Content Coverage',
              'data-filter="unassigned"',
              'Export CSV',
              'loadCoverage(true)',
              'String(existing.ChannelType',
              'String(existing.ContentMode',
              'String(existing.SchedulingMethod',
              'Channel settings saved. Generate a new schedule',
          ]
          missing=[x for x in required_ui if x not in p]
          if missing:
              raise SystemExit(f"1.10.4 UI missing: {missing}")

          forbidden_ui=[
              "page.querySelector('#channelType').disabled=true",
              "page.querySelector('#contentMode').disabled=true",
              "page.querySelector('#schedulingMethod').disabled=true",
              "page.querySelector('#movieContentMode').disabled=true",
              'Channel type, playback mode and schedule strategy are structural',
          ]
          present=[x for x in forbidden_ui if x in p]
          if present:
              raise SystemExit(f"Immutable channel UI returned: {present}")

          for token in ['[HttpGet("ContentCoverage")]', 'CoverageItem(', 'CoverageChannel(']:
              if token not in a:
                  raise SystemExit(f"Coverage API missing: {token}")

          for token in ['Virtual TV Guide UI START', 'guide-channelHeaderCell', 'width: 18vw !important', 'SaveConfiguration("branding", branding)']:
              if token not in v:
                  raise SystemExit(f"Guide UI integration missing: {token}")

          print("Scheduling, editable channels, coverage report and Guide UI validation passed.")
          PY

      - name: Validate watched-state rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          policy=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvModePolicy.cs").read_text(encoding="utf-8")
          protection=Path("Jellyfin.Plugin.VirtualTV/Services/PlaybackStateProtectionManager.cs").read_text(encoding="utf-8")
          stop=Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStopConsumer.cs").read_text(encoding="utf-8")
          resolver=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvEpisodeResolver.cs").read_text(encoding="utf-8")

          for token in ['=> IsDynamicUnwatched(mode)', 'CompleteProtection', 'FinalRestoreGrace', 'RestoreAllIfProtected']:
              if token not in policy+protection+stop:
                  raise SystemExit(f"Watched-state invariant missing: {token}")
          for token in ['Where(candidate => !candidate.Played)', 'selected = PickRandom(unwatched, lastItemId)', 'var next = candidates.FirstOrDefault(candidate => !candidate.Played)']:
              if token not in resolver:
                  raise SystemExit(f"Unwatched resolver invariant missing: {token}")
          print("Watched-state validation passed.")
          PY

      - name: Validate Virtual TV configuration JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          start=page.index('<script type="text/javascript">')+len('<script type="text/javascript">')
          end=page.index('</script>',start)
          Path("/tmp/virtualtv-config.js").write_text(page[start:end],encoding="utf-8")
          PY
          node --check /tmp/virtualtv-config.js

      - name: Validate embedded UI
        shell: bash
        run: |
          DLL="Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll"
          grep -a -q 'data-ui-version="1.10.4.0"' "$DLL"
          grep -a -q 'Content Coverage' "$DLL"
          grep -a -q 'Unassigned' "$DLL"
          grep -a -q 'Generate New Schedule' "$DLL"
          echo "Embedded 1.10.4 UI validation passed."

      - name: Prepare install package
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/VirtualTV
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll artifact/VirtualTV/
          cp build.yaml artifact/VirtualTV/
          cp meta.json artifact/VirtualTV/
          unzip -t <(cd artifact && zip -qr - VirtualTV) >/dev/null 2>&1 || true
          find artifact/VirtualTV -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Upload versioned install package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTV-Jellyfin-12.1-v${{ steps.version.outputs.version }}
          path: artifact/VirtualTV/
          if-no-files-found: error
          retention-days: 90
