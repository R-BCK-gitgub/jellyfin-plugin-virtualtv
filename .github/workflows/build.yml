name: Build Virtual TV Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: virtualtv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install bootstrap media build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate embedded bootstrap videos
        shell: bash
        run: |
          bash scripts/generate-bootstrap-videos.sh
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-10s.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-bootstrap-black-10s.mp4
          ffprobe -v error -show_entries format=format_name,duration -of default=nw=1 Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-live-60s.ts

          # Sanity-check that the transport stream can be consumed in real time without
          # relying on Jellyfin's RequiresLooping path.
          ffmpeg -hide_banner -loglevel error -nostdin -re             -i Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-live-60s.ts             -t 2 -map 0:v:0 -map 0:a:0 -c copy -f null -

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot()
          version = root.findtext(".//Version")
          if not version:
              raise SystemExit("Version not found in csproj")
          print(version.strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Validate package metadata versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version=(ET.parse("Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj").getroot().findtext(".//Version") or "").strip()
          meta_version=str(json.loads(Path("meta.json").read_text(encoding="utf-8")).get("version","")).strip()
          text=Path("build.yaml").read_text(encoding="utf-8")
          m=re.search(r'^version:\s*["\']?([^"\'\s]+)',text,re.MULTILINE)
          build_version=m.group(1) if m else ""
          values={"csproj":version,"meta.json":meta_version,"build.yaml":build_version}
          print(values)
          if version!="1.10.9.0" or len(set(values.values()))!=1:
              raise SystemExit(f"Version mismatch: {values}")
          PY

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.VirtualTV/Jellyfin.Plugin.VirtualTV.csproj --configuration Release --no-restore

      - name: Validate deterministic playback architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          c=Path("Jellyfin.Plugin.VirtualTV/Services/LiveTvPlaybackCoordinator.cs").read_text(encoding="utf-8")
          l=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvLiveTvService.cs").read_text(encoding="utf-8")
          b=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvBootstrapMediaProvider.cs").read_text(encoding="utf-8")
          s=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvStandardStreamService.cs").read_text(encoding="utf-8")
          pc=Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackProgressConsumer.cs").read_text(encoding="utf-8")
          e=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvEpisodeResolver.cs").read_text(encoding="utf-8")
          m=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvMovieResolver.cs").read_text(encoding="utf-8")
          mode=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvModePolicy.cs").read_text(encoding="utf-8")
          cfg=Path("Jellyfin.Plugin.VirtualTV/Configuration/ChannelConfiguration.cs").read_text(encoding="utf-8")

          personalized_required=[
              'BootstrapBuffer = TimeSpan.FromMilliseconds(1500)',
              'VodSeekSettleBuffer = TimeSpan.FromSeconds(1)',
              'VodTeardownBuffer = TimeSpan.FromSeconds(1)',
              'Interlocked.Increment(ref _nextGeneration)',
              'PlaybackPhase.BootstrapWaitingForProgress',
              'PlaybackPhase.BootstrapBuffering',
              'PlaybackPhase.AwaitingVod',
              'PlaybackPhase.Vod',
              'PlaybackPhase.AwaitingBootstrap',
              'SendIsolatedVodPlayNowAsync',
              'SessionMessageType.Play',
              'targetSession.SessionControllers',
              'ItemIds = new[] { itemId }',
              'PlayCommand = PlayCommand.PlayNow',
              'var isolatedStartTicks = 1L',
              'PendingSeekTicks',
              'SeekScheduled',
              'HandleVodProgress',
              'CompleteVodSeekAsync',
              'PlaystateCommand.Seek',
              'Task.Delay(VodSeekSettleBuffer',
              'ReturnToBootstrapAsync',
              'CompleteProtection',
              'VirtualTvModePolicy.IsStandardTV(channel.PlaybackExperience)',
          ]
          missing=[x for x in personalized_required if x not in c]
          if missing:
              raise SystemExit(f"Personalized playback invariant missing: {missing}")

          legacy_forbidden=[
              'ManagedStaticQueueLength',
              'BuildConcreteManagedQueue',
              'ScheduleContinuationFallback',
              'ContinuationFallbackDelay',
              'LgDeferredSeekDelay',
              'SeekLgAfterVodStartAsync',
              'PendingDeferredSeekTicks',
              'IsLgWebOsSession',
              'ManagedQueueOrder',
              'PlayCommand.PlayNext',
              'PlayCommand.PlayLast',
          ]
          present=[x for x in legacy_forbidden if x in c]
          if present:
              raise SystemExit(f"Legacy multi-command playback returned: {present}")

          # The only playstate command is the one guarded, post-progress seek used for
          # Resume/live offsets. Zero-start VOD never receives it.
          if c.count('_sessionManager.SendPlaystateCommand(') != 1:
              raise SystemExit("Safe seek must be the only SendPlaystateCommand in Personalized playback.")
          seek_start=c.index('private async Task CompleteVodSeekAsync')
          seek_end=c.index('private async Task SendBootstrapPlayNowAsync',seek_start)
          seek=c[seek_start:seek_end]
          for token in ['PlaystateCommand.Seek','SeekPositionTicks = seekTicks','Task.Delay(VodSeekSettleBuffer','context.Phase != PlaybackPhase.Vod']:
              if token not in seek:
                  raise SystemExit(f"Safe VOD seek guard missing: {token}")

          isolated_start=c.index('private async Task SendIsolatedVodPlayNowAsync')
          isolated_end=c.index('private async Task CompleteVodSeekAsync',isolated_start)
          isolated=c[isolated_start:isolated_end]
          if '_sessionManager.SendPlayCommand' in isolated:
              raise SystemExit("Isolated VOD must bypass Jellyfin episode queue expansion.")
          for token in ['ItemIds = new[] { itemId }','SessionMessageType.Play','queue length 1','var isolatedStartTicks = 1L']:
              if token not in isolated:
                  raise SystemExit(f"Isolated one-item VOD invariant missing: {token}")

          # PlaybackStart only arms Loading. The 1.5-second clock starts after real progress.
          start_start=c.index('private Task HandleBootstrapStartAsync')
          start_end=c.index('private void HandleBootstrapStop',start_start)
          start_handler=c[start_start:start_end]
          if 'CompleteBootstrapBufferAsync' in start_handler or 'Task.Delay(BootstrapBuffer' in start_handler:
              raise SystemExit("PlaybackStart must not start the Loading timer.")
          progress_start=c.index('private Task HandleBootstrapProgress')
          progress_end=c.index('private Task HandleVodProgress',progress_start)
          progress=c[progress_start:progress_end]
          for token in ['PlaybackPhase.BootstrapWaitingForProgress','PlaybackPhase.BootstrapBuffering','_ = CompleteBootstrapBufferAsync(context)']:
              if token not in progress:
                  raise SystemExit(f"Loading progress gate missing: {token}")
          if 'HandlePlaybackProgressAsync' not in pc or '_coordinator.HandlePlaybackProgressAsync(eventArgs)' not in pc:
              raise SystemExit("PlaybackProgress consumer is not wired.")

          # Universal Personalized loading source stays conventional MPEG-TS.
          bootstrap_required=[
              'Jellyfin.Plugin.VirtualTV.Assets.Bootstrap.virtualtv-loading-live-60s.ts',
              'Container = "mpegts"',
              'SupportsDirectPlay = false',
              'SupportsDirectStream = true',
              'SupportsTranscoding = true',
              'RequiresOpening = false',
              'IsInfiniteStream = true',
              'RunTimeTicks = null',
              'ReadAtNativeFramerate = true',
          ]
          missing=[x for x in bootstrap_required if x not in b]
          if missing:
              raise SystemExit(f"Personalized Loading source invariant missing: {missing}")

          # Resume is a strict first tier for watched-dependent modes.
          episode_required=[
              'candidate.PlaybackPositionTicks > 0',
              'candidate.PlaybackPositionTicks <= 0',
              'selected = PickRandom(resumable, lastItemId)',
              'selectionReason = "RandomResume"',
              'selected = resumable[0]',
              'selectionReason = "NextResume"',
              'startTicks = selected.PlaybackPositionTicks',
              'selected = PickRandom(neverStarted, lastItemId)',
              'selected = neverStarted[0]',
          ]
          missing=[x for x in episode_required if x not in e]
          if missing:
              raise SystemExit(f"Series Resume-first invariant missing: {missing}")
          movie_required=[
              'item.PlaybackPositionTicks > 0',
              'item.PlaybackPositionTicks <= 0',
              'var resume = PickRandom(resumable, lastItemId)',
              '"RandomResume"',
              'resume.PlaybackPositionTicks',
          ]
          missing=[x for x in movie_required if x not in m]
          if missing:
              raise SystemExit(f"Movie Resume-first invariant missing: {missing}")

          # Channel experience is explicit and backward-compatible.
          for token in [
              'PlaybackExperience { get; set; } = "PersonalizedTV"',
              'public const string PersonalizedTV = "PersonalizedTV"',
              'public const string StandardTV = "StandardTV"',
              'NormalizePlaybackExperience',
          ]:
              if token not in cfg+mode:
                  raise SystemExit(f"Channel experience invariant missing: {token}")

          # Standard TV is a separate true Live TV path, never the Personalized coordinator.
          standard_required=[
              'class VirtualTvStandardStreamService',
              'IDirectStreamProvider',
              '/LiveTv/LiveStreamFiles/',
              'Container = "mpegts"',
              'IsInfiniteStream = true',
              'RequiresOpening = true',
              'public override bool CanSeek => false',
              'var offset = nowUtc - entry.GetStartUtc()',
              '_mediaEncoder.EncoderPath',
              '"-ss", FormatSeconds(offset), "-re", "-i", path',
              '"-c:v", "libx264"',
              '"-c:a", "aac"',
              '"-f", "mpegts"',
              'SelectEnglishSubtitle',
              'subtitles=filename=',
              'IsEnglish',
              'normalized == "eng"',
              'normalized == "en"',
              'English subtitles {SubtitleState}',
          ]
          missing=[x for x in standard_required if x not in s]
          if missing:
              raise SystemExit(f"Standard TV invariant missing: {missing}")

          for forbidden in ['IUserDataManager','PlaybackPositionTicks','SendPlayCommand','SendPlaystateCommand','VirtualTvEpisodeResolver','VirtualTvMovieResolver']:
              if forbidden in s:
                  raise SystemExit(f"Standard TV must be state-free; found {forbidden}")

          if 'VirtualTvModePolicy.IsStandardTV(channel.PlaybackExperience)' not in l:
              raise SystemExit("Live TV service does not split Standard and Personalized pipelines.")
          if 'ISupportsDirectStreamProvider' not in l or 'GetChannelStreamWithDirectStreamProvider' not in l:
              raise SystemExit("Standard TV does not use Jellyfin direct Live TV stream provider.")

          print("Personalized/Standard playback architecture validation passed.")
          PY

      - name: Validate 1.10.9 scheduling, editing and coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          g=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvScheduleGenerator.cs").read_text(encoding="utf-8")
          p=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          a=Path("Jellyfin.Plugin.VirtualTV/Api/ChannelController.cs").read_text(encoding="utf-8")
          v=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvVisibilityManager.cs").read_text(encoding="utf-8")

          required_generator=[
              'BuildSmartAppendWithRotation(channel, startUtc, targetUtc, prefix, resetRandomState: true)',
              'Coverage-first weekly template',
              '_smartOrder[_cursor % _smartOrder.Count]',
              'earlierProgrammeCount / Math.Max(1, channel.EpisodesPerTurn)',
              'channel.PlaybackExperience = VirtualTvModePolicy.NormalizePlaybackExperience(channel.PlaybackExperience)',
              'var standardTv = VirtualTvModePolicy.IsStandardTV(channel.PlaybackExperience)',
              '? VirtualTvModePolicy.Random',
              '? (string.Equals(channel.ContentMode, VirtualTvModePolicy.Random',
              'VirtualTvModePolicy.NormalizePlaybackExperience(channel.PlaybackExperience)',
          ]
          missing=[x for x in required_generator if x not in g]
          if missing:
              raise SystemExit(f"Scheduling invariant missing: {missing}")

          required_ui=[
              'data-ui-version="1.10.9.0"',
              'id="channelExperience"',
              '<option value="PersonalizedTV">Personalized TV</option>',
              '<option value="StandardTV">Standard TV</option>',
              'function updateExperienceModeOptions()',
              "standard\n          ? [['Sequential','Sequential'],['Random','Random']]",
              "standard\n          ? [['Random','Random / Shuffle Cycle']]",
              "c.PlaybackExperience=c.PlaybackExperience==='StandardTV'?'StandardTV':'PersonalizedTV'",
              "existing.PlaybackExperience=experience",
              "String(existing.PlaybackExperience||'PersonalizedTV')!==String(experience)",
              "isWatchedDependentMode(experience,type,contentMode)",
              'Resume-first: resumes the earliest chronologically eligible partial episode',
              'Resume-first: randomly chooses among partially watched episodes',
              '<option value="15">15 minutes</option>',
              'Content Coverage',
              'data-filter="unassigned"',
              'Export CSV',
              'loadCoverage(true)',
              'Channel settings saved. Generate a new schedule',
          ]
          missing=[x for x in required_ui if x not in p]
          if missing:
              raise SystemExit(f"1.10.9 UI missing: {missing}")

          forbidden_ui=[
              "page.querySelector('#channelType').disabled=true",
              "page.querySelector('#contentMode').disabled=true",
              "page.querySelector('#schedulingMethod').disabled=true",
              "page.querySelector('#movieContentMode').disabled=true",
          ]
          present=[x for x in forbidden_ui if x in p]
          if present:
              raise SystemExit(f"Unexpected immutable channel UI: {present}")

          for token in ['[HttpGet("ContentCoverage")]', 'CoverageItem(', 'CoverageChannel(']:
              if token not in a:
                  raise SystemExit(f"Coverage API missing: {token}")

          guide_tokens=[
              'Virtual TV Guide UI START',
              '--vtv-guide-row-height: 8.25rem',
              '--vtv-guide-row-gap: .45rem',
              'height: var(--vtv-guide-row-height) !important',
              'margin-top: var(--vtv-guide-row-gap) !important',
              'width: 27vw !important',
              'SaveConfiguration("branding", branding)',
          ]
          missing=[x for x in guide_tokens if x not in v]
          if missing:
              raise SystemExit(f"Guide UI integration missing: {missing}")
          if 'margin-top: -1px !important' in v:
              raise SystemExit("Old overlapping Guide row hack returned.")

          for token in [
              'vtv-coverage-launcher{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap;margin-top:1.5em}',
              'vtv-coverage-card{border:1px solid rgba(255,255,255,.13);border-radius:.7em;padding:1em;background:#202020;color:#fff!important',
              'vtv-coverage-value{font-size:1.65em;font-weight:800;line-height:1.1;color:#fff!important',
              'vtv-coverage-label{margin-top:.25em;opacity:.78;color:#fff!important',
          ]:
              if token not in p:
                  raise SystemExit(f"Content Coverage UI invariant missing: {token}")

          print("Scheduling, channel experiences, Guide and Coverage validation passed.")
          PY

      - name: Validate watched-state rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvModePolicy.cs").read_text(encoding="utf-8")
          protection=Path("Jellyfin.Plugin.VirtualTV/Services/PlaybackStateProtectionManager.cs").read_text(encoding="utf-8")
          stop=Path("Jellyfin.Plugin.VirtualTV/Events/VirtualTvPlaybackStopConsumer.cs").read_text(encoding="utf-8")
          episode=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvEpisodeResolver.cs").read_text(encoding="utf-8")
          movie=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvMovieResolver.cs").read_text(encoding="utf-8")
          standard=Path("Jellyfin.Plugin.VirtualTV/Services/VirtualTvStandardStreamService.cs").read_text(encoding="utf-8")

          for token in ['=> IsDynamicUnwatched(mode)', 'CompleteProtection', 'FinalRestoreGrace', 'RestoreAllIfProtected']:
              if token not in policy+protection+stop:
                  raise SystemExit(f"Watched-state invariant missing: {token}")

          for token in [
              'candidate.PlaybackPositionTicks > 0',
              'candidate.PlaybackPositionTicks <= 0',
              '"NextResume"',
              '"RandomResume"',
              'startTicks = selected.PlaybackPositionTicks',
          ]:
              if token not in episode:
                  raise SystemExit(f"Series Resume invariant missing: {token}")

          for token in ['item.PlaybackPositionTicks > 0','"RandomResume"','resume.PlaybackPositionTicks']:
              if token not in movie:
                  raise SystemExit(f"Movie Resume invariant missing: {token}")

          for forbidden in ['IUserDataManager','PlaybackPositionTicks','CompleteProtection','BeginProtection','UserItemData']:
              if forbidden in standard:
                  raise SystemExit(f"Standard TV unexpectedly touches Jellyfin user state: {forbidden}")

          print("Watched-state and Resume-first validation passed.")
          PY

      - name: Validate Virtual TV configuration JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path("Jellyfin.Plugin.VirtualTV/Configuration/configPage.html").read_text(encoding="utf-8")
          start=page.index('<script type="text/javascript">')+len('<script type="text/javascript">')
          end=page.index('</script>',start)
          Path("/tmp/virtualtv-config.js").write_text(page[start:end],encoding="utf-8")
          PY
          node --check /tmp/virtualtv-config.js

      - name: Smoke-test Standard TV ffmpeg profile
        shell: bash
        run: |
          cat > /tmp/virtualtv-en.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:05,000
          Virtual TV English subtitle smoke test
          EOF

          ffmpeg -hide_banner -loglevel error -nostdin -y             -ss 1 -i Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-10s.mp4             -t 1             -vf "subtitles=filename='/tmp/virtualtv-en.srt',scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30,format=yuv420p"             -map 0:v:0 -map 0:a:0             -c:v libx264 -preset ultrafast -profile:v main -pix_fmt yuv420p             -g 60 -keyint_min 60 -sc_threshold 0             -c:a aac -b:a 160k -ac 2 -ar 48000             -mpegts_flags +resend_headers -muxdelay 0 -muxpreload 0             -f mpegts /tmp/virtualtv-standard-smoke.ts

          python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_streams","-of","json",
              "/tmp/virtualtv-standard-smoke.ts"
          ], text=True))
          streams=data.get("streams",[])
          video=next((x for x in streams if x.get("codec_type")=="video"),None)
          audio=next((x for x in streams if x.get("codec_type")=="audio"),None)
          if not video or video.get("codec_name")!="h264":
              raise SystemExit(f"Standard TV smoke output has no H.264 video: {video}")
          if video.get("width")!=1280 or video.get("height")!=720:
              raise SystemExit(f"Standard TV smoke output is not 1280x720: {video.get('width')}x{video.get('height')}")
          if not audio or audio.get("codec_name")!="aac":
              raise SystemExit(f"Standard TV smoke output has no AAC audio: {audio}")
          print("Standard TV H.264/AAC MPEG-TS + English subtitle burn-in smoke test passed.")
          PY

      - name: Validate embedded UI and bootstrap media
        shell: bash
        run: |
          DLL="Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll"
          grep -a -q 'data-ui-version="1.10.9.0"' "$DLL"
          grep -a -q 'Content Coverage' "$DLL"
          grep -a -q 'Unassigned' "$DLL"
          grep -a -q 'Generate New Schedule' "$DLL"
          grep -a -q 'virtualtv-loading-10s.mp4' "$DLL"
          grep -a -q 'virtualtv-bootstrap-black-10s.mp4' "$DLL"
          grep -a -q 'virtualtv-loading-live-60s.ts' "$DLL"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          for name in ["virtualtv-loading-10s.mp4", "virtualtv-bootstrap-black-10s.mp4"]:
              path=Path("Jellyfin.Plugin.VirtualTV/Assets/Bootstrap")/name
              if not path.exists() or path.stat().st_size < 10000:
                  raise SystemExit(f"Bootstrap video missing or unexpectedly small: {name}")
              duration=float(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=nw=1:nk=1",str(path)
              ], text=True).strip())
              if not 9.9 <= duration <= 10.1:
                  raise SystemExit(f"Unexpected bootstrap duration for {name}: {duration}")

          live=Path("Jellyfin.Plugin.VirtualTV/Assets/Bootstrap/virtualtv-loading-live-60s.ts")
          if not live.exists() or live.stat().st_size < 100000:
              raise SystemExit("Live MPEG-TS bootstrap is missing or unexpectedly small.")
          duration=float(subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=nw=1:nk=1",str(live)
          ], text=True).strip())
          if not 59.5 <= duration <= 60.5:
              raise SystemExit(f"Unexpected live bootstrap duration: {duration}")
          fmt=subprocess.check_output([
              "ffprobe","-v","error","-show_entries","format=format_name",
              "-of","default=nw=1:nk=1",str(live)
          ], text=True).strip()
          if "mpegts" not in fmt:
              raise SystemExit(f"Live bootstrap is not MPEG-TS: {fmt}")
          PY

          echo "Embedded 1.10.9 UI, MP4 fallbacks and 60-second MPEG-TS Personalized bootstrap validation passed."

      - name: Prepare install package
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/VirtualTV
          cp Jellyfin.Plugin.VirtualTV/bin/Release/net10.0/Jellyfin.Plugin.VirtualTV.dll artifact/VirtualTV/
          cp build.yaml artifact/VirtualTV/
          cp meta.json artifact/VirtualTV/
          unzip -t <(cd artifact && zip -qr - VirtualTV) >/dev/null 2>&1 || true
          find artifact/VirtualTV -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Upload versioned install package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualTV-Jellyfin-12.1-v${{ steps.version.outputs.version }}
          path: artifact/VirtualTV/
          if-no-files-found: error
          retention-days: 90
